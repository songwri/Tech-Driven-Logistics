<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#a72b2b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TDL Lab</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f6f5;
        color: #534a47;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", system-ui, sans-serif;
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 420px; }
      img { display: block; height: 32px; width: auto; margin: 0 0 40px; }
      h1 { margin: 0; font-size: 1.5rem; line-height: 1.3; letter-spacing: -0.02em; color: #2b2522; }
      p { margin: 12px 0 0; line-height: 1.7; color: #736662; }
      nav { margin-top: 32px; display: grid; gap: 10px; }
      a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border: 1px solid rgba(172, 168, 167, 0.7);
        background: #fff;
        color: #2b2522;
        font-weight: 600;
        text-decoration: none;
        transition: border-color 0.2s, color 0.2s;
      }
      a:hover, a:focus-visible { border-color: #a72b2b; color: #a72b2b; outline: none; }
      a span { color: #736662; font-weight: 400; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <img src="/tdl-logo.png" alt="TDL · Tech Driven Logistics" width="597" height="240" />
      <h1>이 페이지는 운영하지 않습니다</h1>
      <p>TDL Lab 소개 페이지는 현재 운영하지 않습니다. 방문 예약과 방명록은 아래에서 이용하실 수 있습니다.</p>
      <nav aria-label="바로가기">
        <a href="reserve/">방문 예약 <span>투어 일정 신청</span></a>
        <a href="guestbook/">방명록 <span>방문 기록 보기 · 남기기</span></a>
      </nav>
    </main>
  </body>
</html>
