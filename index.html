<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#a72b2b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>TDL Lab</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f6f5;
        color: #534a47;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", system-ui, sans-serif;
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 420px; }
      img { display: block; height: 32px; width: auto; margin: 0 0 32px; }
      nav { display: grid; gap: 10px; }
      nav a {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border: 1px solid rgba(172, 168, 167, 0.7);
        background: #fff;
        color: #2b2522;
        font-weight: 600;
        text-decoration: none;
        transition: border-color 0.2s, color 0.2s;
      }
      nav a:hover, nav a:focus-visible { border-color: #a72b2b; color: #a72b2b; outline: none; }
      nav a span { color: #aca8a7; font-weight: 400; }
      /* 관리자 바로가기: 오른쪽 아래 구석의 작은 점 (아는 사람만 누르도록) */
      .admin {
        position: fixed;
        right: 10px;
        bottom: 10px;
        width: 14px;
        height: 14px;
        display: grid;
        place-items: center;
      }
      .admin::before {
        content: "";
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #aca8a7;
        opacity: 0.35;
        transition: opacity 0.2s, background 0.2s;
      }
      .admin:hover::before, .admin:focus-visible::before { opacity: 1; background: #a72b2b; }
      .admin:focus-visible { outline: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/tdl-logo.png" alt="TDL · Tech Driven Logistics" width="597" height="240" />
      <nav aria-label="바로가기">
        <a href="reserve/">방문 예약 <span aria-hidden="true">→</span></a>
        <a href="guestbook/">방명록 <span aria-hidden="true">→</span></a>
      </nav>
    </main>
    <a class="admin" href="admin/" aria-label="관리자" title="관리자"></a>
  </body>
</html>
