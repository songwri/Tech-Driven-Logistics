- tmrGbLane:
    Control: Timer@2.1.0
    Properties:
      X: =0
      Y: =0
      Width: =1
      Height: =1
      Duration: =80
      Repeat: =true
      AutoStart: =true
      Visible: =false
      Start: =gGbPlay && !gGbWriting && !IsEmpty(FirstN(Filter(colGbPublic, Rating >= 4), 10))
      OnTimerEnd: =Set(gGbOffset, Mod(gGbOffset + 3.2, Max(1, CountRows(FirstN(Filter(colGbPublic, Rating >= 4), 10)) * 288)))
