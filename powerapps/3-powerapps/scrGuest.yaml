            - conGbLane:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  X: =0
                  Y: =300
                  Width: =pw
                  Height: =196
                  Fill: =cSoft
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                Children:
                  - galGbLane:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =With(
                              {r: FirstN(Filter(colGbPublic, Rating >= 4), 10)},
                              With(
                                  {n: CountRows(r)},
                                  ForAll(
                                      Sequence(n * 2) As i,
                                      With(
                                          {k: Mod(i.Value - 1, n) + 1},
                                          With(
                                              {e: Last(FirstN(r, k))},
                                              {
                                                  No: "GB-" & Text(e.WrittenAt, "mmdd") & "-" & Text(k, "00"),
                                                  Pid: e.Title,
                                                  DisplayName: e.DisplayName,
                                                  Role: e.Role,
                                                  Aff: Trim(e.DisplayCompany & " " & e.DisplayTeam),
                                                  Rating: e.Rating,
                                                  Message: e.Message
                                              }
                                          )
                                      )
                                  )
                              )
                          )
                        X: =24 - gGbOffset
                        Y: =16
                        Width: =Max(1, CountRows(FirstN(Filter(colGbPublic, Rating >= 4), 10)) * 2) * 288
                        Height: =166
                        TemplateSize: =166
                        TemplatePadding: =0
                        ShowScrollbar: =false
                        BorderThickness: =0
                        Fill: =Color.Transparent
