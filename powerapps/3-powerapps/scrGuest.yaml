# scrGuest — 방명록 (모든 사용자 · 센터 현장 태블릿). 웹 /guestbook/ 과 같은 구성
#   · 왼쪽: 제목 · 가명 처리 안내 · [방명록 남기기], 오른쪽: 공개 소감 평균 만족도 (웹의 로봇 그림 자리)
#   · 가운데 띠: 별점 4점 이상 최근 10건이 소포처럼 왼쪽으로 흘러감 (웹 EntryConveyor, 초당 40px), [멈춤] 으로 정지
#   · [방명록 남기기]: 투어 카드(종합 · TDL Lab · 메가와이즈) · 0.5점 단위 별점 · 소감 100자 · 이름 · 회사 · 팀(선택) · 직책 · 가명 미리보기 · 동의
# ── [PA 전용] 웹앱에 없는 기능 · 수정하면 이 목록과 수식 속 '// [PA 전용]' 주석도 함께 고칠 것 (README 14) ──
#   · 공개 화면은 가명 값만 든 GuestbookPublic 목록을 읽음 (실명 원본 Guestbook 은 관리자만). 웹은 서버가 가명 값만 내려 줌
#   · 등록은 흐름 TDLGuestbookAdd 로 원본 목록에 저장 (작성자에게 원본 목록 권한이 없어도 됨). 웹은 Apps Script
#   · 오른쪽 평균 만족도 카드 (웹은 로봇 · 컨베이어 그림)
#   · conGbBody: 본문만 스크롤 · 폭은 창 폭에 맞춰 kx 배
# 1) 새 화면(빈 화면) → 이름 scrGuest, 화면 Fill = cBg, Width = sw, Height = sh
#    OnVisible =
#      Set(gGbWriting, false); Set(gGbOffset, 0); Set(gGbPlay, true);
#      ClearCollect(colGbPublic, FirstN(SortByColumns(GuestbookPublic, "WrittenAt", SortOrder.Descending), 200))
# 2) 이 파일 내용을 전부 복사 → 트리 뷰에서 scrGuest 오른쪽 클릭 → '붙여넣기'
# 3) 타이머(tmrGbLane) 붙여넣기에서 오류가 나면: 삽입 → 입력 → 타이머를 직접 추가해 이름을 tmrGbLane 으로 바꾸고 아래 속성을 넣으세요.
#    Duration = 80, Repeat = true, AutoStart = true, Visible = false, Start = 위 YAML 의 Start 값, OnTimerEnd = 위 YAML 의 OnTimerEnd 값
