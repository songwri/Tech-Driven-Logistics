            - btnGbSubmit:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(gGbSending, "등록 중…", "등록하기")
                  X: =706
                  Y: =If(gGbDetail, 660, 560) - 56
                  Width: =110
                  Height: =40
                  OnSelect: |-
                    =Set(gGbTried, true);
                    With(
                        {msg: If(
                        IsBlank(gGbTour), "참여하신 투어를 선택해 주세요.",
                        gGbRating = 0, "별점을 선택해 주세요.",
                        IsBlank(Trim(txtGbMessage.Text)), "방문 소감을 한 줄 남겨 주세요.",
                        IsBlank(Trim(txtGbName.Text)), "이름을 입력해 주세요.",
                        IsBlank(Trim(txtGbCompany.Text)), "회사명을 입력해 주세요.",
                        IsBlank(Trim(txtGbRole.Text)), "직책을 입력해 주세요.",
                        !chkGbConsent.Value, "개인정보 수집 · 이용에 동의해 주세요.",
                        ""
                    )},
                        If(
                            !IsBlank(msg),
                            Notify(msg, NotificationType.Warning),
                            Set(gGbSending, true);
                            IfError(
                                // 원본(실명)은 관리자만 볼 수 있는 Guestbook 목록에 흐름(흐름 소유자 권한)으로 저장. 공개용 가명 행은 흐름 G 가 만든다.
                                TDLGuestbookAdd.Run(Trim(txtGbName.Text), Trim(txtGbCompany.Text), Coalesce(Trim(txtGbTeam.Text), "-"), Trim(txtGbRole.Text), gGbRating, gGbTour, Trim(txtGbMessage.Text));
                                // 공개 목록에 반영되기 전에도 컨베이어에 바로 보이게 (웹의 '방금 도착')
                                With(
                                    {pid: "new-" & Text(Now(), "hhmmss")},
                                    Collect(colGbPublic, {
                                        Title: pid,
                                        DisplayName: Concat(Filter(Split(Trim(txtGbName.Text), " "), !IsBlank(Value)), Left(Value, 1) & "**", " "),
                                        DisplayCompany: If(IsBlank(Trim(txtGbCompany.Text)), "", Left(Trim(txtGbCompany.Text), 1) & "**"),
                                        DisplayTeam: If(IsBlank(Trim(txtGbTeam.Text)), "", Left(Trim(txtGbTeam.Text), 1) & "**"),
                                        Role: Trim(txtGbRole.Text),
                                        Rating: gGbRating,
                                        Message: Trim(txtGbMessage.Text),
                                        Tour: gGbTour,
                                        WrittenAt: Now()
                                    });
                                    ClearCollect(colGbPublic, SortByColumns(colGbPublic, "WrittenAt", SortOrder.Descending));
                                    Set(gGbFresh, pid)
                                );
                                Set(gGbOffset, 0);
                                Set(gGbWriting, false);
                                Notify("방명록이 등록되었습니다. 감사합니다.", NotificationType.Success),
                                Notify("방명록을 등록하지 못했습니다. 잠시 후 다시 시도해 주세요.", NotificationType.Error)
                            );
                            Set(gGbSending, false)
                        )
                    )
                  Font: =fnt
                  Size: =10.5
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  Fill: =cPrimary
                  Color: =cSurface
                  HoverFill: =cPrimaryHover
                  PressedFill: =cPrimaryHover
                  HoverColor: =cSurface
                  PressedColor: =cSurface
                  BorderThickness: =0
                  DisabledFill: =cSoft
                  DisabledColor: =cInk3
                  DisplayMode: =If(gGbSending, DisplayMode.Disabled, DisplayMode.Edit)
