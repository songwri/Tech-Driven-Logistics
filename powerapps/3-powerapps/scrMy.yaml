# scrMy — 내 신청 (신청자 본인 것만)
# ── [PA 전용] 웹앱에 없는 기능 · 수정하면 이 목록과 수식 속 '// [PA 전용]' 주석도 함께 고칠 것 (README 14) ──
#   · 화면 전체: 신청자 본인의 신청 목록 · 참석자 제출 현황 · 대기 건 취소 (웹에는 신청자용 조회 화면이 없음)
#   · btnMyCancel: 취소하면 TourBusy 의 대기 자리도 지움
#   · conMBody: 본문만 스크롤 · 폭은 창 폭에 맞춰 kx 배(최대 MaxStretch)로 늘어남
#   · hdrMAdmZone · hdrMAdmLabel: 관리자 메뉴(예약 관리 · 달력 · 통계 · 가이드 배정 · 방명록 관리)를 오른쪽 묶음 + 관리자 표시로 구분 (관리자만 보임)
# 1) 새 화면(빈 화면) → 이름 scrMy, 화면 Fill = cBg, Width = sw, Height = sh
#    OnVisible = Refresh(VisitRequests); UpdateContext({locCancelArm: false})
# 2) 이 파일 내용을 전부 복사 → 트리 뷰에서 scrMy 오른쪽 클릭 → '붙여넣기'
- conMBody:
    Control: GroupContainer@1.3.0
    Variant: AutoLayout
    Properties:
      X: =0
      Y: =56
      Width: =sw
      Height: =sh - 56
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutOverflowY: =LayoutOverflow.Scroll // [PA 전용] 본문 스크롤 레이아웃. 웹은 페이지 스크롤
      Fill: =Color.Transparent
      BorderThickness: =0
      DropShadow: =DropShadow.None
    Children:
      - conMPage:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            Width: =pw
            Height: =712
            FillPortions: =0
            Fill: =Color.Transparent
            BorderThickness: =0
            DropShadow: =DropShadow.None
          Children:
