- btnGdLoad:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      X: =0
      Y: =0
      Width: =0
      Height: =0
      OnSelect: |-
        =// [PA 전용] 그 해 확정 방문을 한 번에 읽어 둠 (SharePoint 2000행 제한 회피) · 웹은 시트 전체를 읽음
        With(
            {s: DateAdd(Date(gGdYear, 1, 1), -7, TimeUnit.Days), e: DateAdd(Date(gGdYear + 1, 1, 1), 7, TimeUnit.Days)},
            ClearCollect(colGdRaw, Filter(VisitRequests, VisitDate >= s && VisitDate < e && (Status = "승인" || Status = "완료")))
        );
        ClearCollect(
            colGdVisits,
            ForAll(
                Filter(colGdRaw, Tour in ["lab", "combined", "all3", "other"]) As r,
                With(
                    {lf: Coalesce(LookUp(TourSlots, Tour = r.Tour && Slot = r.Slot, LFrom), If(IsBlank(r.Slot), -1, Value(Left(r.Slot, 2)) * 60 + Value(Mid(r.Slot, 4, 2))))},
                    {
                        ID: r.ID,
                        ReqNo: r.Title,
                        Key: r.DateKey,
                        D: r.VisitDate,
                        Tour: r.Tour,
                        TourName: r.TourName,
                        Slot: r.Slot,
                        Sched: r.ScheduleText,
                        Company: r.Company,
                        Heads: If(r.AttendeeCount > 0, r.AttendeeCount, r.ExpectedHeadcount),
                        Guides: Coalesce(r.Guides, ""),
                        Start: lf,
                        Half: If(lf < 0, "tbd", lf < 720, "am", "pm"),
                        Time: If(lf < 0, "미정", Text(Time(RoundDown(lf / 60, 0), Mod(lf, 60), 0), "hh:mm")),
                        Color: Coalesce(LookUp(Tours, Id = r.Tour, Color), cInk3)
                    }
                )
            )
        );
        Clear(colGdRaw);
        ClearCollect(
            colGdWork,
            ForAll(
                Sequence(12) As k,
                {
                    M: k.Value,
                    Days: CountRows(
                        Filter(
                            Sequence(Day(DateAdd(Date(gGdYear, k.Value + 1, 1), -1, TimeUnit.Days))) As d,
                            Weekday(Date(gGdYear, k.Value, d.Value), StartOfWeek.Monday) <= 5 && !(Text(Date(gGdYear, k.Value, d.Value), "yyyy-mm-dd") in HolidayKeys.Value)
                        )
                    )
                }
            )
        );
        Select(btnGdParse)
      Font: =fnt
      Size: =9.75
      Fill: =cSurface
      Color: =cInk
      HoverFill: =cSoft
      HoverColor: =cInk
      PressedFill: =cSoft
      PressedColor: =cInk
      BorderColor: =cLine
      BorderThickness: =1
      RadiusTopLeft: =0
      RadiusTopRight: =0
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      Visible: =false
- btnGdParse:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =""
      X: =0
      Y: =0
      Width: =0
      Height: =0
      OnSelect: |-
        =// 가이드 칸(줄마다 한 명)을 사람별 역할로 풀어 둠. 규칙은 웹 guideRoster.ts parseGuides 와 같음
        // (인솔자) · [인솔] · 인솔: · 예전 (메인) 표시는 인솔자, 표시 없는 줄은 운영 가능자면 운영 인원 · 아니면(팀장) 인솔자. 명단 밖 이름은 저장할 때 그대로 둠
        ClearCollect(
            colGdAssign,
            Ungroup(
                ForAll(
                    colGdVisits As v,
                    {
                        Rows: ForAll(
                            Filter(colRoster, Find(Title, v.Guides) > 0) As m,
                            With(
                                {ln: LookUp(Split(Substitute(v.Guides, ",", Char(10)), Char(10)), Find(m.Title, Value) > 0, Value)},
                                {
                                    VisitId: v.ID,
                                    D: v.D,
                                    Key: v.Key,
                                    Half: v.Half,
                                    Name: m.Title,
                                    Sort: m.SortOrder,
                                    Role: If(IsMatch(ln, "[\(\[]\s*(인솔자?|메인)\s*[\)\]]|(인솔자?|메인)\s*[:：]", MatchOptions.Contains) || m.CanOperate <> "Y", "인솔", "운영")
                                }
                            )
                        )
                    }
                ),
                "Rows"
            )
        );
        // 사람 × 월 투입 (1건 = 반일 4시간, M/M = 투입 시간 ÷ (근무일 × 8시간))
        ClearCollect(
            colGdMM,
            Ungroup(
                ForAll(
                    colRoster As m,
                    {
                        Rows: ForAll(
                            colGdWork As w,
                            With(
                                {
                                    lead: CountRows(Filter(colGdAssign, Name = m.Title && Role = "인솔" && Year(D) = gGdYear && Month(D) = w.M)),
                                    op: CountRows(Filter(colGdAssign, Name = m.Title && Role = "운영" && Year(D) = gGdYear && Month(D) = w.M))
                                },
                                {
                                    Name: m.Title,
                                    Label: m.Title & " " & m.RankTitle,
                                    Sort: m.SortOrder,
                                    CanOp: m.CanOperate = "Y",
                                    M: w.M,
                                    Lead: lead,
                                    Op: op,
                                    Hours: (lead + op) * 4,
                                    MM: If(w.Days > 0, (lead + op) * 4 / (w.Days * 8), 0)
                                }
                            )
                        )
                    }
                ),
                "Rows"
            )
        );
        Set(gGdYearMax, Max(0.01, Max(colGdMM, MM)))
