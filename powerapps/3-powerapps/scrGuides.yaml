# scrGuides — 투어 가이드 배정 (센터 관리자 main 만). 웹 관리자 '가이드 배정' 탭(GuideAssignView · GuideWeekly)과 같은 화면
# ── [PA 전용] 웹앱에 없는 기능 · 수정하면 이 목록과 수식 속 '// [PA 전용]' 주석도 함께 고칠 것 (README 14) ──
#   · conGdBody: 본문만 스크롤 · 폭은 창 폭에 맞춰 kx 배(최대 MaxStretch)로 늘어남
#   · btnGdLoad: 그 해 확정 방문을 한 번에 읽어 둠 (SharePoint 2000행 제한 회피)
#   · btnGdSave: 연속 클릭 잠금
#   · 가이드 명단을 SharePoint GuideRoster 목록에서 읽음 (웹은 코드 guideRoster.ts 에 고정)
#   · hdrGDAdmZone · hdrGDAdmLabel: 관리자 메뉴(예약 관리 · 달력 · 통계 · 가이드 배정 · 방명록 관리)를 오른쪽 묶음 + 관리자 표시로 구분 (관리자만 보임)
# 화면 구성 (위에서 아래로, 본문 스크롤)
#   ① 달력: 그 달 배정 대상 방문(승인 · 완료 + TDL Lab 이 들어간 투어 · 수기 등록) 칩. 인솔자 미배정은 빨간 점선
#   ② 배정 패널: 인솔자(복수) · 운영 인원(복수, 전체 선택) → 저장하면 VisitRequests.Guides 에 줄마다 한 명
#   ③ 주간 배정표: 월~일 × 오전 · 오후 · 시간 미정 (Lab 구간 시작 시각 기준) + 이 주 인원별 가동률
#   ④ 월간 인원별 투입 (M/M): 인솔 · 운영 · 합계 · 투입 시간 · M/M (1건 = 4시간, 근무일 × 8시간 = 1 M/M)
#   ⑤ 연간 월별 M/M: 사람 × 월 (값이 클수록 진하게)
# 준비: SharePoint 목록 GuideRoster (Title 이름 · RankTitle 직책 · CanOperate Y/N · SortOrder 순서), VisitRequests 에 Guides(여러 줄 텍스트) 열
# 1) 새 화면(빈 화면) → 이름 scrGuides, 화면 Fill = cBg, Width = sw, Height = sh
#    OnVisible =
#      If(gAdminSite <> "main", Notify("센터 관리자만 볼 수 있습니다.", NotificationType.Error); Navigate(scrAdmin),
#         ClearCollect(colRoster, SortByColumns(GuideRoster, "SortOrder"));
#         If(IsBlank(gGdMonth), Set(gGdMonth, Date(Year(Today()), Month(Today()), 1)));
#         If(IsBlank(gGdWeek), Set(gGdWeek, DateAdd(Today(), 1 - Weekday(Today(), StartOfWeek.Monday), TimeUnit.Days)));
#         Set(gGdYear, Year(gGdMonth));
#         Set(gGdSel, Blank());
#         Set(gGdBusy, false);
#         Set(gGdLeads, Filter(Table({Value: ""}), false));
#         Set(gGdOps, Filter(Table({Value: ""}), false));
#         Select(btnGdLoad))
# 2) 이 파일 내용을 전부 복사 → 트리 뷰에서 scrGuides 오른쪽 클릭 → '붙여넣기'
- conGdBody:
    Control: GroupContainer@1.3.0
    Variant: AutoLayout
    Properties:
      X: =0
      Y: =56
      Width: =sw
      Height: =sh - 56
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutOverflowY: =LayoutOverflow.Scroll // [PA 전용] 본문 스크롤 레이아웃. 웹은 페이지 스크롤
      Fill: =Color.Transparent
      BorderThickness: =0
      DropShadow: =DropShadow.None
    Children:
      - conGdPage:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            Width: =pw
            Height: =2208
            FillPortions: =0
            Fill: =Color.Transparent
            BorderThickness: =0
            DropShadow: =DropShadow.None
          Children:
            - conGdCal:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  X: =24
                  Y: =16
                  Width: =956 * kx
                  Height: =696
                  Fill: =cSurface
                  BorderColor: =cLine
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                Children:
                  - lblGdCalTitle:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="투어 가이드 배정"
                        X: =16
                        Y: =14
                        Width: =160
                        Height: =24
                        Font: =fnt
                        Size: =11.25
                        FontWeight: =FontWeight.Semibold
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                  - btnGdPrev:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="‹"
                        X: =184
                        Y: =10
                        Width: =32
                        Height: =32
                        OnSelect: =Set(gGdMonth, DateAdd(gGdMonth, -1, TimeUnit.Months)); Set(gGdSel, Blank()); If(Year(gGdMonth) <> gGdYear, Set(gGdYear, Year(gGdMonth)); Select(btnGdLoad))
                        Font: =fnt
                        Size: =10.5
                        FontWeight: =FontWeight.Semibold
                        Fill: =cSurface
                        Color: =cInk2
                        HoverFill: =cSoft
                        HoverColor: =cInk
                        PressedFill: =cSoft
                        PressedColor: =cInk
                        BorderColor: =cLine
                        BorderThickness: =1
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                  - lblGdMonth:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Text(gGdMonth, "yyyy년 m월")
                        X: =220
                        Y: =10
                        Width: =110
                        Height: =32
                        Font: =fnt
                        Size: =11.25
                        FontWeight: =FontWeight.Semibold
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                  - btnGdNext:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="›"
                        X: =334
                        Y: =10
                        Width: =32
                        Height: =32
                        OnSelect: =Set(gGdMonth, DateAdd(gGdMonth, 1, TimeUnit.Months)); Set(gGdSel, Blank()); If(Year(gGdMonth) <> gGdYear, Set(gGdYear, Year(gGdMonth)); Select(btnGdLoad))
                        Font: =fnt
                        Size: =10.5
                        FontWeight: =FontWeight.Semibold
                        Fill: =cSurface
                        Color: =cInk2
                        HoverFill: =cSoft
                        HoverColor: =cInk
                        PressedFill: =cSoft
                        PressedColor: =cInk
                        BorderColor: =cLine
                        BorderThickness: =1
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                  - lblGdCount:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =With({n: CountRows(Filter(colGdVisits, Year(D) = Year(gGdMonth) && Month(D) = Month(gGdMonth)))}, n & "건 · ")
                        X: =380
                        Y: =14
                        Width: =60
                        Height: =24
                        Font: =fnt
                        Size: =9
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                  - lblGdUnassigned:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="인솔자 미배정 " & CountRows(Filter(colGdVisits, Year(D) = Year(gGdMonth) && Month(D) = Month(gGdMonth) && !(ID in Filter(colGdAssign, Role = "인솔").VisitId))) & "건"
                        X: =442
                        Y: =14
                        Width: =160
                        Height: =24
                        Font: =fnt
                        Size: =9
                        FontWeight: =FontWeight.Semibold
                        Color: =If(CountRows(Filter(colGdVisits, Year(D) = Year(gGdMonth) && Month(D) = Month(gGdMonth) && !(ID in Filter(colGdAssign, Role = "인솔").VisitId))) > 0, cBrand, cGreen)
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                  - lblGdHint:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="승인 · 완료된 Lab 포함 투어 · 칩을 눌러 배정"
                        X: =956 * kx - 360
                        Y: =14
                        Width: =344
                        Height: =24
                        Font: =fnt
                        Size: =9
                        Color: =cInk3
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        Align: =Align.Right
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                  - galGdWeekday:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Items: =["일", "월", "화", "수", "목", "금", "토"]
                        X: =12
                        Y: =52
                        Width: =956 * kx - 24
                        Height: =26
                        TemplateSize: =26
                        TemplatePadding: =0
                        ShowScrollbar: =false
                        BorderThickness: =0
                        Fill: =Color.Transparent
                        WrapCount: =7
                      Children:
                        - lblGdWeekday:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.Value
                              X: =0
                              Y: =0
                              Width: =(956 * kx - 24) / 7
                              Height: =26
                              Font: =fnt
                              Size: =9
                              FontWeight: =FontWeight.Semibold
                              Color: =If(ThisItem.Value in ["일", "토"], cInk3, cInk)
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =false
                              Fill: =cBg
                  - galGdGrid:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =With(
                              {start: DateAdd(gGdMonth, 1 - Weekday(gGdMonth), TimeUnit.Days)},
                              ForAll(
                                  Sequence(42, 0) As n,
                                  With(
                                      {d: DateAdd(start, n.Value, TimeUnit.Days)},
                                      {D: d, Key: Text(d, "yyyy-mm-dd"), InMonth: Month(d) = Month(gGdMonth), Off: Weekday(d) in [1, 7] || Text(d, "yyyy-mm-dd") in HolidayKeys.Value, IsToday: d = Today()}
                                  )
                              )
                          )
                        X: =12
                        Y: =80
                        Width: =956 * kx - 24
                        Height: =600
                        TemplateSize: =100
                        TemplatePadding: =0
                        ShowScrollbar: =false
                        BorderThickness: =0
                        Fill: =Color.Transparent
                        WrapCount: =7
                      Children:
                        - rctGdCell:
                            Control: Rectangle@2.3.0
                            Properties:
                              X: =0
                              Y: =0
                              Width: =(956 * kx - 24) / 7
                              Height: =100
                              Fill: =If(ThisItem.InMonth && !ThisItem.Off, cSurface, cBg)
                              BorderColor: =cLine
                              BorderThickness: =1
                        - btnGdDayNum:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =Day(ThisItem.D)
                              X: =4
                              Y: =4
                              Width: =22
                              Height: =22
                              OnSelect: =false
                              Font: =fnt
                              Size: =9
                              FontWeight: =FontWeight.Semibold
                              Fill: =If(ThisItem.IsToday, cBrand, Color.Transparent)
                              Color: =If(ThisItem.IsToday, cSurface, !ThisItem.InMonth, cInk3, ThisItem.Off, ColorValue("#C77A7A"), cInk)
                              HoverFill: =cSoft
                              HoverColor: =If(ThisItem.IsToday, cSurface, !ThisItem.InMonth, cInk3, ThisItem.Off, ColorValue("#C77A7A"), cInk)
                              PressedFill: =cSoft
                              PressedColor: =If(ThisItem.IsToday, cSurface, !ThisItem.InMonth, cInk3, ThisItem.Off, ColorValue("#C77A7A"), cInk)
                              BorderColor: =Color.Transparent
                              BorderThickness: =0
                              RadiusTopLeft: =11
                              RadiusTopRight: =11
                              RadiusBottomLeft: =11
                              RadiusBottomRight: =11
                              DisplayMode: =DisplayMode.View
                        - galGdChips:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              Items: |-
                                =With({all: SortByColumns(Filter(colGdVisits, Key = ThisItem.Key), "Start")}, FirstN(all, If(CountRows(all) > 2, 1, 2)))
                              X: =3
                              Y: =28
                              Width: =(956 * kx - 24) / 7 - 6
                              Height: =68
                              TemplateSize: =34
                              TemplatePadding: =0
                              ShowScrollbar: =false
                              BorderThickness: =0
                              Fill: =Color.Transparent
                            Children:
                              - btnGdChip:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    Text: =""
                                    X: =0
                                    Y: =0
                                    Width: =(956 * kx - 24) / 7 - 6
                                    Height: =32
                                    OnSelect: |-
                                      =Set(gGdSel, LookUp(colGdVisits, ID = ThisItem.ID)); Set(gGdLeads, ForAll(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), {Value: Name})); Set(gGdOps, ForAll(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "운영"), {Value: Name}))
                                    Font: =fnt
                                    Size: =9.75
                                    Fill: =If(gGdSel.ID = ThisItem.ID, cInk, IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")), cRedBg, cSurface)
                                    Color: =cInk
                                    HoverFill: =If(gGdSel.ID = ThisItem.ID, cInk, cSoft)
                                    HoverColor: =cInk
                                    PressedFill: =If(gGdSel.ID = ThisItem.ID, cInk, cSoft)
                                    PressedColor: =cInk
                                    BorderColor: =If(IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")) && gGdSel.ID <> ThisItem.ID, cBrand, cLine)
                                    BorderThickness: =1
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    BorderStyle: =If(IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")), BorderStyle.Dashed, BorderStyle.Solid)
                              - rctGdChipBar:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =4
                                    Height: =32
                                    Fill: =ThisItem.Color
                                    OnSelect: =Select(btnGdChip)
                              - lblGdChip1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =ThisItem.Time & "  " & ThisItem.Company
                                    X: =8
                                    Y: =2
                                    Width: =(956 * kx - 24) / 7 - 18
                                    Height: =15
                                    Font: =fnt
                                    Size: =8.25
                                    FontWeight: =FontWeight.Semibold
                                    Color: =If(gGdSel.ID = ThisItem.ID, cSurface, cInk)
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                                    OnSelect: =Select(btnGdChip)
                              - lblGdChip2:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: =If(IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")), "인솔자 미배정", Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ") & If(CountRows(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "운영")) > 0, " + " & CountRows(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "운영")) & "명", ""))
                                    X: =8
                                    Y: =16
                                    Width: =(956 * kx - 24) / 7 - 18
                                    Height: =14
                                    Font: =fnt
                                    Size: =8.25
                                    FontWeight: =FontWeight.Semibold
                                    Color: =If(gGdSel.ID = ThisItem.ID, cSurface, IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")), cBrand, cInk2)
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    VerticalAlign: =VerticalAlign.Middle
                                    Wrap: =false
                                    OnSelect: =Select(btnGdChip)
                        - lblGdMore:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="+" & (CountRows(Filter(colGdVisits, Key = ThisItem.Key)) - 1) & "건 더 (아래 주간 표)"
                              X: =6
                              Y: =64
                              Width: =(956 * kx - 24) / 7 - 10
                              Height: =18
                              Font: =fnt
                              Size: =8.25
                              Color: =cInk2
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              VerticalAlign: =VerticalAlign.Middle
                              Wrap: =false
                              Visible: =CountRows(Filter(colGdVisits, Key = ThisItem.Key)) > 2
                              OnSelect: =Set(gGdWeek, DateAdd(ThisItem.D, 1 - Weekday(ThisItem.D, StartOfWeek.Monday), TimeUnit.Days))
            - conGdPanel:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  X: =24 + 956 * kx + 16
                  Y: =16
                  Width: =346
                  Height: =696
                  Fill: =cSurface
                  BorderColor: =cLine
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                Children:
                  - lblGdPanelTitle:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="배정"
                        X: =16
                        Y: =14
                        Width: =200
                        Height: =24
                        Font: =fnt
                        Size: =11.25
                        FontWeight: =FontWeight.Semibold
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                  - lblGdPanelEmpty:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If(CountRows(Filter(colGdVisits, Year(D) = Year(gGdMonth) && Month(D) = Month(gGdMonth))) = 0, "이 달에는 확정된 방문이 없습니다.", "달력에서 일정을 누르면" & Char(10) & "인솔자와 운영 인원을 정할 수 있습니다.")
                        X: =16
                        Y: =260
                        Width: =314
                        Height: =60
                        Font: =fnt
                        Size: =9.75
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =true
                        Visible: =IsBlank(gGdSel)
                  - rctGdSelBox:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =16
                        Y: =48
                        Width: =314
                        Height: =74
                        Fill: =cSoft
                        Visible: =!IsBlank(gGdSel)
                  - rctGdSelBar:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =16
                        Y: =48
                        Width: =5
                        Height: =74
                        Fill: =gGdSel.Color
                        Visible: =!IsBlank(gGdSel)
                  - lblGdSelWhen:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Text(gGdSel.D, "m/d (ddd)") & " · " & gGdSel.Sched
                        X: =30
                        Y: =54
                        Width: =292
                        Height: =18
                        Font: =fnt
                        Size: =9
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        Visible: =!IsBlank(gGdSel)
                  - lblGdSelCompany:
                      Control: Label@2.5.1
                      Properties:
                        Text: =gGdSel.Company
                        X: =30
                        Y: =72
                        Width: =292
                        Height: =24
                        Font: =fnt
                        Size: =11.25
                        FontWeight: =FontWeight.Semibold
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        Visible: =!IsBlank(gGdSel)
                  - lblGdSelInfo:
                      Control: Label@2.5.1
                      Properties:
                        Text: =gGdSel.TourName & " · " & gGdSel.Heads & "명 · 투입 1타임(4시간)"
                        X: =30
                        Y: =98
                        Width: =292
                        Height: =18
                        Font: =fnt
                        Size: =9
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        Visible: =!IsBlank(gGdSel)
                  - lblGdLeadHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="인솔자"
                        X: =16
                        Y: =128
                        Width: =80
                        Height: =20
                        Font: =fnt
                        Size: =9.75
                        FontWeight: =FontWeight.Semibold
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        Visible: =!IsBlank(gGdSel)
                  - lblGdLeadHint:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="복수 선택"
                        X: =70
                        Y: =128
                        Width: =100
                        Height: =20
                        Font: =fnt
                        Size: =9
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Wrap: =false
                        Visible: =!IsBlank(gGdSel)
                  - conGdAssign:
                      Control: GroupContainer@1.3.0
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: =0
                        Width: =346
                        Height: =696
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        DropShadow: =DropShadow.None
                        Visible: =!IsBlank(gGdSel)
                      Children:
                        - galGdLeads:
                            Control: Gallery@2.15.0
                            Variant: Vertical
