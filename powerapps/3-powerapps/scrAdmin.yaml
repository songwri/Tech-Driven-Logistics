                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="막기"
                  X: =348
                  Y: =392
                  Width: =104
                  Height: =40
                  OnSelect: |-
                    =// [PA 전용] 막기 번호 뒤 무작위 4자리 (같은 초 충돌 방지)
                    If(
                        IsBlank(dpBlock.SelectedDate),
                        Notify("날짜를 고르세요.", NotificationType.Warning),
                        With(
                            {
                                f: Switch(gBlockTime, "종일", 0, "오전", 540, 720),
                                e: Switch(gBlockTime, "종일", 1440, "오전", 720, 1080),
                                c: gBlockTarget in ["메가와이즈", "센터 · Lab"],
                                l: gBlockTarget in ["TDL Lab", "센터 · Lab"],
                                m: gBlockTarget = "시화MTV"
                            },
                            Patch(
                                TourBusy,
                                Defaults(TourBusy),
                                {
                                    Title: "BLOCK-" & Text(Now(), "yymmdd-hhmmss") & "-" & Upper(Left(Substitute(Text(GUID()), "-", ""), 4)),
                                    DateKey: Text(dpBlock.SelectedDate, "yyyy-mm-dd"),
                                    MonthKey: Text(dpBlock.SelectedDate, "yyyy-mm"),
                                    CFrom: If(c, f, -1), CTo: If(c, e, -1),
                                    LFrom: If(l, f, -1), LTo: If(l, e, -1),
                                    MFrom: If(m, f, -1), MTo: If(m, e, -1),
                                    Kind: "막기",
                                    Reason: gBlockTarget & " · " & gBlockTime & If(IsBlank(txtBlockReason.Text), "", " · " & txtBlockReason.Text)
                                }
                            )
                        );
                        Set(gShowBlock, false);
                        Notify("일정을 막았습니다. 신청 달력에 바로 반영됩니다.", NotificationType.Success)
                    )
                  Font: =fnt
                  Size: =10.5
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  Fill: =cPrimary
                  Color: =cSurface
                  HoverFill: =cPrimaryHover
                  PressedFill: =cPrimaryHover
                  HoverColor: =cSurface
                  PressedColor: =cSurface
                  BorderThickness: =0
                  DisabledFill: =cSoft
                  DisabledColor: =cInk3
