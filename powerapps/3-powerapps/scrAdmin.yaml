                        {
                            both: gSel.ForMain = "Y" && gSel.ForMtv = "Y",
                            mtvFirst: gSel.MFrom >= 0 && (gSel.CFrom < 0 || gSel.MFrom < gSel.CFrom) && (gSel.LFrom < 0 || gSel.MFrom < gSel.LFrom),
                            gm: LookUp(colGuides, Title = "main"),
                            gv: LookUp(colGuides, Title = "mtv"),
                            msg: Trim(txtMailMsg.Text),
                            early: Coalesce(LookUp(colGuides, Title = "main").ArriveBefore, 10)
                        },
                        With(
                            {
                                blkMain: If(gSel.ForMain = "Y", Char(10) & Char(10) & "■ 오시는 길" & If(both, " · 메가와이즈 청라", "") & Char(10) & If(IsBlank(gm.Address), "위치 · 주차는 담당자가 별도로 안내드립니다.", "위치: " & gm.Address & Char(10) & "주차: " & gm.Parking & If(!IsBlank(gm.Meeting) && (IsBlank(gm.MeetingTours) || gSel.Tour in Split(gm.MeetingTours, ",").Result), Char(10) & "미팅 장소: " & gm.Meeting, "") & If(!IsBlank(gm.MapUrl), Char(10) & "지도: " & gm.MapUrl, "") & If(!IsBlank(gm.MapImageUrl), Char(10) & "[약도 이미지가 본문에 함께 들어갑니다]", "")), ""),
                                blkMtv: If(gSel.ForMtv = "Y", Char(10) & Char(10) & "■ 오시는 길" & If(both, " · 시화MTV", "") & Char(10) & If(IsBlank(gv.Address), "위치 · 주차는 담당자가 별도로 안내드립니다.", "위치: " & gv.Address & Char(10) & "주차: " & gv.Parking & If(!IsBlank(gv.Meeting) && (IsBlank(gv.MeetingTours) || gSel.Tour in Split(gv.MeetingTours, ",").Result), Char(10) & "미팅 장소: " & gv.Meeting, "") & If(!IsBlank(gv.MapUrl), Char(10) & "지도: " & gv.MapUrl, "") & If(!IsBlank(gv.MapImageUrl), Char(10) & "[약도 이미지가 본문에 함께 들어갑니다]", "")), ""),
                                plan: gSel.TourName & " · " & gSel.DateKey & " " & gSel.ScheduleText
                            },
                            Switch(
                                gMailMode,
                                "승인",
                                If(If(gAdminSite = "main", gSel.ApproveMtv = "대기", gAdminSite = "mtv" && gSel.ApproveMain = "대기"), "※ 이 승인만으로는 메일이 나가지 않습니다. 상대 센터까지 승인되면 아래 메일이 신청자에게 발송됩니다." & Char(10) & Char(10), "") &
                                "방문이 확정되었습니다" & Char(10) & "신청번호 " & gSel.Title & Char(10) & Char(10) &
                                "일정: " & plan & Char(10) &
                                "참석자: " & gSel.AttendeeCount & "명 정보 제출 완료 (예상 " & gSel.ExpectedHeadcount & "명)" &
                                If(msg = "", "", Char(10) & "담당자 안내: " & msg) &
                                If(mtvFirst, blkMtv & blkMain, blkMain & blkMtv) & Char(10) & Char(10) &
                                "· 투어 시작 " & early & "분 전까지 도착해 주세요." &
                                If(both, Char(10) & "· 두 센터는 떨어져 있어 오전 투어가 끝나면 오후 투어 장소로 이동해 주셔야 합니다.", "") &
                                Char(10) & "· 문의나 일정 변경 · 취소는 최소 1일 전까지 담당자와 직접 소통해 주세요.",
                                "거절",
                                "요청하신 일정으로는 방문이 어렵습니다" & Char(10) & Char(10) & gSel.Company & " · " & plan & Char(10) & Char(10) &
                                "사유" & Char(10) & Coalesce(msg, "-") & Char(10) & Char(10) &
                                "다른 날짜로 다시 신청해 주시거나, 이 메일에 회신해 문의해 주세요.",
                                "방문 일정이 취소되었습니다" & Char(10) & Char(10) & gSel.Company & " · " & plan & Char(10) & Char(10) &
                                "사유" & Char(10) & Coalesce(msg, "-") & Char(10) & Char(10) &
                                "다시 방문을 원하시면 새로 신청해 주세요."
                            )
                        )
                    )
                  X: =378
                  Y: =116
                  Width: =518
