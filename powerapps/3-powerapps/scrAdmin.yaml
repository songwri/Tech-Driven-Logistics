            - btnMailCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: ="돌아가기"
                  X: =684
                  Y: =418
                  Width: =100
                  Height: =40
                  OnSelect: =Set(gMailMode, Blank())
                  Font: =fnt
                  Size: =10.5
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  Fill: =cSurface
                  Color: =cInk
                  HoverFill: =cSoft
                  PressedFill: =cSoft
                  HoverColor: =cInk
                  PressedColor: =cInk
                  BorderColor: =cLine
                  BorderThickness: =1
                  DisabledFill: =cSoft
                  DisabledColor: =cInk3
                  DisabledBorderColor: =cLine
            - btnMailSend:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(locWorking, "보내는 중…", gMailMode = "승인", If(gMailMode = "승인" && If(gAdminSite = "main", gSel.ApproveMtv = "대기", gAdminSite = "mtv" && gSel.ApproveMain = "대기"), "승인 기록", "승인하고 보내기"), gMailMode & "하고 보내기")
                  X: =796
                  Y: =418
                  Width: =100
                  Height: =40
                  OnSelect: |-
                    =// [PA 전용] 승인 · 거절 · 취소를 미리보기 창에서 한 번에 보냄. 웹은 확인 창 없이 바로 처리하고 거절 사유는 메일에 넣지 않음
                    Switch(
                        gMailMode,
                        "승인",
                    If(
                        !locWorking,
                        UpdateContext({locWorking: true});
                        With(
                            {cur: LookUp(VisitRequests, ID = gSel.ID)},
                            If(
                                cur.Status <> "대기" || Switch(gAdminSite, "main", cur.ApproveMain, "mtv", cur.ApproveMtv, "") <> "대기",
                                Notify("다른 관리자가 먼저 처리한 건입니다. 최신 상태로 다시 불러왔습니다.", NotificationType.Warning),
                                With(
                                    {final: If(If(gAdminSite = "main", "승인", cur.ApproveMain) <> "대기" && If(gAdminSite = "mtv", "승인", cur.ApproveMtv) <> "대기", "승인", "대기")},
                                    If(
                                        final = "승인" && !IsEmpty(Filter(Filter(TourBusy, DateKey = cur.DateKey) As b, b.Title <> cur.Title && b.Kind <> "대기" && ((cur.CFrom >= 0 && b.CFrom >= 0 && cur.CFrom < b.CTo && b.CFrom < cur.CTo) || (cur.LFrom >= 0 && b.LFrom >= 0 && cur.LFrom < b.LTo && b.LFrom < cur.LTo) || (cur.MFrom >= 0 && b.MFrom >= 0 && cur.MFrom < b.MTo && b.MFrom < cur.MTo)))),
                                        Notify("같은 시간에 이미 확정되었거나 막힌 일정이 있습니다. 달력을 확인해 주세요.", NotificationType.Error),
                                        If(
                                            gAdminSite = "main",
                                            Patch(VisitRequests, cur, {ApproveMain: "승인", Status: final, AdminMemo: txtMailMsg.Text}),
                                            Patch(VisitRequests, cur, {ApproveMtv: "승인", Status: final, AdminMemo: txtMailMsg.Text})
                                        );
                                        With(
                                            {after: LookUp(VisitRequests, ID = cur.ID)},
                                            If(
                                                after.Status = "대기" && after.ApproveMain <> "대기" && after.ApproveMtv <> "대기",
                                                Patch(VisitRequests, after, {Status: "승인"})
                                            )
                                        );
                                        If(
                                            LookUp(VisitRequests, ID = cur.ID, Status) = "승인",
                                            Remove(TourBusy, Filter(TourBusy, Title = cur.Title));
                                            Patch(
                                                TourBusy,
                                                Defaults(TourBusy),
                                                {
                                                    Title: cur.Title, DateKey: cur.DateKey, MonthKey: Left(cur.DateKey, 7),
                                                    CFrom: cur.CFrom, CTo: cur.CTo, LFrom: cur.LFrom, LTo: cur.LTo, MFrom: cur.MFrom, MTo: cur.MTo,
                                                    Kind: "예약", Reason: cur.TourName
                                                }
                                            );
                                            IfError(
                                                TDLVisitDecision.Run(cur.ID, "승인", Coalesce(txtMailMsg.Text, "-"));
                                                Notify("승인했습니다. 신청자에게 확정 메일이 발송됩니다.", NotificationType.Success),
                                                Notify("승인은 저장됐지만 확정 메일을 보내지 못했습니다. 신청자에게 직접 알려 주세요.", NotificationType.Warning)
                                            ),
                                            Notify("이 센터의 승인을 기록했습니다. 상대 센터의 승인을 기다립니다.", NotificationType.Success)
                                        )
                                    )
                                )
                            )
                        );
                        ClearCollect(colAdminReqs, Filter(VisitRequests, VisitDate >= DateAdd(Today(), -180, TimeUnit.Days)));
                        Set(gSel, LookUp(colAdminReqs, ID = gSel.ID));
                        UpdateContext({locWorking: false})
                    ),
                        "거절",
                    If(
                        !locWorking,
                        UpdateContext({locWorking: true});
                        With(
                            {cur: LookUp(VisitRequests, ID = gSel.ID)},
                            If(
                                cur.Status <> "대기",
                                Notify("다른 관리자가 먼저 처리한 건입니다. 최신 상태로 다시 불러왔습니다.", NotificationType.Warning),
                                If(
                                    gAdminSite = "main",
                                    Patch(VisitRequests, cur, {Status: "거절", ApproveMain: "거절", AdminMemo: txtMailMsg.Text}),
                                    Patch(VisitRequests, cur, {Status: "거절", ApproveMtv: "거절", AdminMemo: txtMailMsg.Text})
                                );
                                Remove(TourBusy, Filter(TourBusy, Title = cur.Title));
                                IfError(
                                    TDLVisitDecision.Run(cur.ID, "거절", Coalesce(txtMailMsg.Text, "-"));
                                    Notify("거절했습니다. 신청자에게 메일이 발송됩니다.", NotificationType.Success),
                                    Notify("거절은 저장됐지만 결과 메일을 보내지 못했습니다. 신청자에게 직접 알려 주세요.", NotificationType.Warning)
                                )
                            )
                        );
                        ClearCollect(colAdminReqs, Filter(VisitRequests, VisitDate >= DateAdd(Today(), -180, TimeUnit.Days)));
                        Set(gSel, LookUp(colAdminReqs, ID = gSel.ID));
                        UpdateContext({locWorking: false})
                    ),
                        "취소",
                    If(
                        !locWorking,
                        UpdateContext({locWorking: true});
                        Patch(VisitRequests, LookUp(VisitRequests, ID = gSel.ID), {Status: "취소", AdminMemo: txtMailMsg.Text});
                        Remove(TourBusy, Filter(TourBusy, Title = gSel.Title));
                        IfError(
                            TDLVisitDecision.Run(gSel.ID, "취소", Coalesce(txtMailMsg.Text, "-"));
                            Notify("일정을 취소했습니다. 신청자에게 메일이 발송됩니다.", NotificationType.Success),
                            Notify("취소는 저장됐지만 안내 메일을 보내지 못했습니다. 신청자에게 직접 알려 주세요.", NotificationType.Warning)
                        );
                        ClearCollect(colAdminReqs, Filter(VisitRequests, VisitDate >= DateAdd(Today(), -180, TimeUnit.Days)));
                        Set(gSel, LookUp(colAdminReqs, ID = gSel.ID));
                        UpdateContext({locWorking: false})
                    )
                    );
                    Set(gMailMode, Blank())
                  Font: =fnt
                  Size: =10.5
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  Fill: =cPrimary
                  Color: =cSurface
                  HoverFill: =cPrimaryHover
                  PressedFill: =cPrimaryHover
                  HoverColor: =cSurface
                  PressedColor: =cSurface
                  BorderColor: =cLine
                  BorderThickness: =0
                  DisabledFill: =cSoft
                  DisabledColor: =cInk3
