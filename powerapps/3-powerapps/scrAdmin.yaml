# scrAdmin — 관리자 (TourAdmins 목록에 있는 사람만 들어올 수 있음)
# ── [PA 전용] 웹앱에 없는 기능 · 수정하면 이 목록과 수식 속 '// [PA 전용]' 주석도 함께 고칠 것 (README 14) ──
#   · 승인 · 거절 · 일정 취소 · 방문 완료: 처리 중 버튼 잠금 · 누르는 순간 최신 상태 재확인 · 메일 흐름 실패 경고
#   · 승인: 복합 투어에서 자기 센터 칸만 저장 + 두 센터 모두 승인이면 바로 확정 (동시 승인 덮어쓰기 방지)
#   · 일정 막기: 막기 번호 무작위 4자리
#   · OnVisible: 공휴일 목록이 끝나 가면 알림
#   · 관리자 구분: 키 입력 대신 회사 로그인 + TourAdmins 목록
#   · conABody: 본문만 스크롤
# 1) 새 화면(빈 화면) → 이름 scrAdmin, 화면 Fill = cBg, Width = sw, Height = sh
#    OnVisible =
#      If(IsBlank(gAdminSite), Notify("관리자 권한이 없습니다.", NotificationType.Error); Navigate(scrBook),
#         ClearCollect(colAdminReqs, Filter(VisitRequests, VisitDate >= DateAdd(Today(), -180, TimeUnit.Days)));
#         If(Year(Today()) + 1 > HolidayLastYear, Notify("공휴일 목록(App.Formulas 의 HolidayKeys)이 " & HolidayLastYear & "년까지만 있습니다. 그 뒤 날짜는 신청 달력에서 닫혀 있으니 다음 해 공휴일을 추가해 주세요.", NotificationType.Warning));
#         If(!IsBlank(Param("requestNo")), Set(gAdminFilter, "전체"); Set(gSel, LookUp(colAdminReqs, Title = Param("requestNo"))));
#         If(!IsBlank(gOpenId), Set(gAdminFilter, "전체"); Set(gSel, Coalesce(LookUp(colAdminReqs, ID = gOpenId), LookUp(VisitRequests, ID = gOpenId))); Set(gOpenId, Blank())))
# 2) 이 파일 내용을 전부 복사 → 트리 뷰에서 scrAdmin 오른쪽 클릭 → '붙여넣기'
- conABody:
    Control: GroupContainer@1.3.0
    Variant: AutoLayout
    Properties:
      X: =0
      Y: =56
      Width: =sw
      Height: =sh - 56
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutOverflowY: =LayoutOverflow.Scroll // [PA 전용] 본문 스크롤 레이아웃. 웹은 페이지 스크롤
      Fill: =Color.Transparent
      BorderThickness: =0
      DropShadow: =DropShadow.None
    Children:
      - conAPage:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            Width: =1366
            Height: =712
            FillPortions: =0
            Fill: =Color.Transparent
            BorderThickness: =0
            DropShadow: =DropShadow.None
          Children:
            - conAdminList:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  X: =24
                  Y: =16
                  Width: =440
                  Height: =680
                  Fill: =cSurface
                  BorderColor: =cLine
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                Children:
                  - lblAdminTitle:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="예약 요청"
                        X: =20
                        Y: =16
                        Width: =90
                        Height: =24
                        Font: =fnt
                        Size: =11.5
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        FontWeight: =FontWeight.Semibold
                  - lblAdminSite:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Switch(gAdminSite, "main", "메가와이즈 · TDL Lab", "mtv", "시화MTV", "hq", "통합 관제 (보기 전용)", "")
                        X: =100
                        Y: =19
                        Width: =210
                        Height: =20
                        Font: =fnt
                        Size: =9
                        Color: =cInk3
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                  - btnOpenBlock:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="일정 막기"
                        X: =320
                        Y: =10
                        Width: =100
                        Height: =32
                        OnSelect: |-
                          =Set(gBlockTarget, If(gAdminSite = "mtv", "시화MTV", "메가와이즈"));
                          Set(gBlockTime, "종일");
                          Set(gBlockDate, Today());
                          Reset(dpBlock);
                          Reset(txtBlockReason);
                          Set(gShowBlock, true)
                        Font: =fnt
                        Size: =9.75
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        Fill: =cSurface
                        Color: =cInk
                        HoverFill: =cSoft
                        PressedFill: =cSoft
                        HoverColor: =cInk
                        PressedColor: =cInk
                        BorderColor: =cLine
                        HoverBorderColor: =cInk3
                        BorderThickness: =1
                        DisabledFill: =cSurface
                        DisabledColor: =cInk3
                        DisabledBorderColor: =cLine
                        Visible: =gAdminSite <> "hq"
                  - btnFilterWait:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="대기 " & CountRows(Filter(colAdminReqs, (gAdminSite = "hq" || (gAdminSite = "main" && ForMain = "Y") || (gAdminSite = "mtv" && ForMtv = "Y")) && Status = "대기"))
                        X: =20
                        Y: =52
                        Width: =96
                        Height: =32
                        OnSelect: =Set(gAdminFilter, "대기")
                        Font: =fnt
                        Size: =9.75
                        Fill: =If(gAdminFilter = "대기", cPrimary, cSurface)
                        Color: =If(gAdminFilter = "대기", cSurface, cInk)
                        HoverFill: =If(gAdminFilter = "대기", cPrimaryHover, cSoft)
                        HoverColor: =If(gAdminFilter = "대기", cSurface, cInk)
                        PressedFill: =If(gAdminFilter = "대기", cPrimaryHover, cSoft)
                        PressedColor: =If(gAdminFilter = "대기", cSurface, cInk)
                        BorderColor: =If(gAdminFilter = "대기", cPrimary, cLine)
                        HoverBorderColor: =If(gAdminFilter = "대기", cPrimary, cInk3)
                        BorderThickness: =1
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                  - btnFilterOk:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="승인"
                        X: =122
                        Y: =52
                        Width: =96
                        Height: =32
                        OnSelect: =Set(gAdminFilter, "승인")
                        Font: =fnt
                        Size: =9.75
                        Fill: =If(gAdminFilter = "승인", cPrimary, cSurface)
                        Color: =If(gAdminFilter = "승인", cSurface, cInk)
                        HoverFill: =If(gAdminFilter = "승인", cPrimaryHover, cSoft)
                        HoverColor: =If(gAdminFilter = "승인", cSurface, cInk)
                        PressedFill: =If(gAdminFilter = "승인", cPrimaryHover, cSoft)
                        PressedColor: =If(gAdminFilter = "승인", cSurface, cInk)
                        BorderColor: =If(gAdminFilter = "승인", cPrimary, cLine)
                        HoverBorderColor: =If(gAdminFilter = "승인", cPrimary, cInk3)
                        BorderThickness: =1
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                  - btnFilterAll:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="전체"
                        X: =224
                        Y: =52
                        Width: =96
                        Height: =32
                        OnSelect: =Set(gAdminFilter, "전체")
                        Font: =fnt
                        Size: =9.75
                        Fill: =If(gAdminFilter = "전체", cPrimary, cSurface)
                        Color: =If(gAdminFilter = "전체", cSurface, cInk)
                        HoverFill: =If(gAdminFilter = "전체", cPrimaryHover, cSoft)
                        HoverColor: =If(gAdminFilter = "전체", cSurface, cInk)
                        PressedFill: =If(gAdminFilter = "전체", cPrimaryHover, cSoft)
                        PressedColor: =If(gAdminFilter = "전체", cSurface, cInk)
                        BorderColor: =If(gAdminFilter = "전체", cPrimary, cLine)
                        HoverBorderColor: =If(gAdminFilter = "전체", cPrimary, cInk3)
                        BorderThickness: =1
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                  - txtAdminSearch:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: =""
                        HintText: ="업체명 · 신청자 · 신청번호 검색"
                        X: =20
                        Y: =96
                        Width: =400
                        Height: =36
                        Font: =fnt
                        Size: =10.5
                        Color: =cInk
                        Fill: =cSurface
                        BorderColor: =cLine
                        HoverBorderColor: =cInk3
                        FocusedBorderColor: =cInk
                        BorderThickness: =1
                        FocusedBorderThickness: =1
                        PaddingLeft: =10
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                  - galAdmin:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =SortByColumns(
                              Filter(
                                  colAdminReqs,
                                  (gAdminSite = "hq" || (gAdminSite = "main" && ForMain = "Y") || (gAdminSite = "mtv" && ForMtv = "Y"))
                                      && (gAdminFilter = "전체" || Status = gAdminFilter)
                                      && (IsBlank(txtAdminSearch.Text) || txtAdminSearch.Text in Company || txtAdminSearch.Text in HostName || txtAdminSearch.Text in Title)
                              ),
                              "VisitDate",
                              If(gAdminFilter = "대기", SortOrder.Ascending, SortOrder.Descending)
                          )
                        X: =20
                        Y: =144
                        Width: =400
                        Height: =520
                        TemplateSize: =90
                        TemplatePadding: =0
                        ShowScrollbar: =true
                        BorderThickness: =0
                        Fill: =Color.Transparent
                        OnSelect: =Set(gSel, ThisItem)
                      Children:
                        - btnAdminItem:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =""
                              X: =0
                              Y: =0
                              Width: =400
                              Height: =86
                              OnSelect: =Select(Parent)
                              Fill: =If(ThisItem.ID = gSel.ID, cSoft, cSurface)
                              HoverFill: =cSoft
                              PressedFill: =cSoft
                              BorderThickness: =0
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                        - lblAdmCompany:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.Company
                              X: =16
                              Y: =14
                              Width: =300
                              Height: =24
                              Font: =fnt
                              Size: =11.25
                              Color: =cInk
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Select(Parent)
                        - lblAdmInfo:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(DateValue(ThisItem.DateKey), "mm/dd") & " (" & Text(DateValue(ThisItem.DateKey), "ddd", "ko-KR") & ") " & Left(ThisItem.Slot, 5) & " · " & ThisItem.TourName
                              X: =16
                              Y: =42
                              Width: =370
                              Height: =20
                              Font: =fnt
                              Size: =9
                              Color: =cInk2
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              OnSelect: =Select(Parent)
                        - lblAdmSub:
                            Control: Label@2.5.1
                            Properties:
                              Text: =ThisItem.HostName & " " & ThisItem.HostTitle & " · 참석자 " & ThisItem.AttendeeCount & "/" & ThisItem.ExpectedHeadcount & If(ThisItem.Status = "대기" && ThisItem.ApproveMain = "승인" && ThisItem.ApproveMtv = "대기", " · 시화MTV 승인 대기", ThisItem.Status = "대기" && ThisItem.ApproveMtv = "승인" && ThisItem.ApproveMain = "대기", " · 메가와이즈 · Lab 승인 대기", "")
                              X: =16
                              Y: =62
                              Width: =370
                              Height: =20
                              Font: =fnt
                              Size: =9
                              Color: =cInk3
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              PaddingBottom: =0
                              OnSelect: =Select(Parent)
                        - tagAdmStatus:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: =ThisItem.Status
                              X: =328
                              Y: =14
                              Width: =56
                              Height: =22
                              DisplayMode: =DisplayMode.View
                              Font: =fnt
                              Size: =9
                              FontWeight: =FontWeight.Semibold
                              Fill: =LookUp(StatusStyle, S = ThisItem.Status, Bg)
                              Color: =LookUp(StatusStyle, S = ThisItem.Status, Fg)
                              BorderThickness: =0
                              RadiusTopLeft: =11
                              RadiusTopRight: =11
                              RadiusBottomLeft: =11
                              RadiusBottomRight: =11
                              OnSelect: =false
                        - rctAdmLine:
                            Control: Rectangle@2.3.0
                            Properties:
                              X: =0
                              Y: =89
                              Width: =400
                              Height: =1
                              Fill: =cLine
            - conAdminDetail:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  X: =480
                  Y: =16
                  Width: =862
                  Height: =680
                  Fill: =cSurface
                  BorderColor: =cLine
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Visible: =!IsBlank(gSel)
                Children:
                  - lblSelNo:
                      Control: Label@2.5.1
                      Properties:
                        Text: =gSel.Title & " · " & Text(gSel.Created, "yyyy.mm.dd") & " 신청"
                        X: =28
                        Y: =24
                        Width: =500
                        Height: =20
                        Font: =Font.Consolas
                        Size: =9
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                  - lblSelCompany:
                      Control: Label@2.5.1
                      Properties:
                        Text: =gSel.Company
                        X: =28
                        Y: =44
                        Width: =420
                        Height: =32
                        Font: =fnt
                        Size: =16.5
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        FontWeight: =FontWeight.Semibold
                  - tagSelStatus:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =gSel.Status
                        X: =460
                        Y: =50
                        Width: =56
                        Height: =22
                        DisplayMode: =DisplayMode.View
                        Font: =fnt
                        Size: =9
                        FontWeight: =FontWeight.Semibold
                        Fill: =LookUp(StatusStyle, S = gSel.Status, Bg)
                        Color: =LookUp(StatusStyle, S = gSel.Status, Fg)
                        BorderThickness: =0
                        RadiusTopLeft: =11
                        RadiusTopRight: =11
                        RadiusBottomLeft: =11
                        RadiusBottomRight: =11
                        OnSelect: =false
                  - btnReject:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="거절"
                        X: =598
                        Y: =40
                        Width: =110
                        Height: =40
                        OnSelect: |-
                          =// [PA 전용] 연속 클릭 잠금, 최신 상태 재확인, TourBusy 대기 자리 해제, 흐름 실패 경고
                          If(
                              !locWorking,
                              UpdateContext({locWorking: true});
                              With(
                                  {cur: LookUp(VisitRequests, ID = gSel.ID)},
                                  If(
                                      cur.Status <> "대기",
                                      Notify("다른 관리자가 먼저 처리한 건입니다. 최신 상태로 다시 불러왔습니다.", NotificationType.Warning),
                                      If(
                                          gAdminSite = "main",
                                          Patch(VisitRequests, cur, {Status: "거절", ApproveMain: "거절", AdminMemo: txtMemo.Text}),
                                          Patch(VisitRequests, cur, {Status: "거절", ApproveMtv: "거절", AdminMemo: txtMemo.Text})
                                      );
                                      Remove(TourBusy, Filter(TourBusy, Title = cur.Title));
                                      IfError(
                                          TDLVisitDecision.Run(cur.ID, "거절", Coalesce(txtMemo.Text, "-"));
                                          Notify("거절했습니다. 신청자에게 메일이 발송됩니다.", NotificationType.Success),
                                          Notify("거절은 저장됐지만 결과 메일을 보내지 못했습니다. 신청자에게 직접 알려 주세요.", NotificationType.Warning)
                                      )
                                  )
                              );
                              ClearCollect(colAdminReqs, Filter(VisitRequests, VisitDate >= DateAdd(Today(), -180, TimeUnit.Days)));
                              Set(gSel, LookUp(colAdminReqs, ID = gSel.ID));
                              UpdateContext({locWorking: false})
                          )
                        Font: =fnt
                        Size: =10.5
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        Fill: =cSurface
                        Color: =cRed
                        HoverFill: =cSoft
                        PressedFill: =cSoft
                        HoverColor: =cRed
                        PressedColor: =cRed
                        BorderColor: =cLine
                        HoverBorderColor: =cInk3
                        BorderThickness: =1
                        DisabledFill: =cSurface
                        DisabledColor: =cInk3
                        DisabledBorderColor: =cLine
                        Visible: =gSel.Status = "대기" && Switch(gAdminSite, "main", gSel.ApproveMain, "mtv", gSel.ApproveMtv, "") = "대기"
                        DisplayMode: =If(locWorking, DisplayMode.Disabled, DisplayMode.Edit) // [PA 전용] 처리 중 버튼 잠금. 웹에는 없음
                  - btnApprove:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="승인"
                        X: =720
                        Y: =40
                        Width: =110
                        Height: =40
                        OnSelect: |-
                          =// [PA 전용] 연속 클릭 잠금, 최신 상태 재확인, 자기 센터 칸만 저장 후 두 센터 모두 승인이면 확정, 대기 자리를 관리자 행(예약)으로 교체, 흐름 실패 경고. 웹은 서버 잠금 안에서 처리
                          If(
                              !locWorking,
                              UpdateContext({locWorking: true});
                              With(
                                  {cur: LookUp(VisitRequests, ID = gSel.ID)},
                                  If(
                                      cur.Status <> "대기" || Switch(gAdminSite, "main", cur.ApproveMain, "mtv", cur.ApproveMtv, "") <> "대기",
                                      Notify("다른 관리자가 먼저 처리한 건입니다. 최신 상태로 다시 불러왔습니다.", NotificationType.Warning),
                                      With(
                                          {final: If(If(gAdminSite = "main", "승인", cur.ApproveMain) <> "대기" && If(gAdminSite = "mtv", "승인", cur.ApproveMtv) <> "대기", "승인", "대기")},
                                          If(
                                              final = "승인" && !IsEmpty(Filter(Filter(TourBusy, DateKey = cur.DateKey) As b, b.Title <> cur.Title && b.Kind <> "대기" && ((cur.CFrom >= 0 && b.CFrom >= 0 && cur.CFrom < b.CTo && b.CFrom < cur.CTo) || (cur.LFrom >= 0 && b.LFrom >= 0 && cur.LFrom < b.LTo && b.LFrom < cur.LTo) || (cur.MFrom >= 0 && b.MFrom >= 0 && cur.MFrom < b.MTo && b.MFrom < cur.MTo)))),
                                              Notify("같은 시간에 이미 확정되었거나 막힌 일정이 있습니다. 달력을 확인해 주세요.", NotificationType.Error),
                                              If(
                                                  gAdminSite = "main",
                                                  Patch(VisitRequests, cur, {ApproveMain: "승인", Status: final, AdminMemo: txtMemo.Text}),
                                                  Patch(VisitRequests, cur, {ApproveMtv: "승인", Status: final, AdminMemo: txtMemo.Text})
                                              );
                                              With(
                                                  {after: LookUp(VisitRequests, ID = cur.ID)},
                                                  If(
                                                      after.Status = "대기" && after.ApproveMain <> "대기" && after.ApproveMtv <> "대기",
                                                      Patch(VisitRequests, after, {Status: "승인"})
                                                  )
                                              );
                                              If(
                                                  LookUp(VisitRequests, ID = cur.ID, Status) = "승인",
                                                  Remove(TourBusy, Filter(TourBusy, Title = cur.Title));
                                                  Patch(
                                                      TourBusy,
                                                      Defaults(TourBusy),
                                                      {
                                                          Title: cur.Title, DateKey: cur.DateKey, MonthKey: Left(cur.DateKey, 7),
                                                          CFrom: cur.CFrom, CTo: cur.CTo, LFrom: cur.LFrom, LTo: cur.LTo, MFrom: cur.MFrom, MTo: cur.MTo,
                                                          Kind: "예약", Reason: cur.TourName
                                                      }
                                                  );
                                                  IfError(
                                                      TDLVisitDecision.Run(cur.ID, "승인", Coalesce(txtMemo.Text, "-"));
                                                      Notify("승인했습니다. 신청자에게 확정 메일이 발송됩니다.", NotificationType.Success),
                                                      Notify("승인은 저장됐지만 확정 메일을 보내지 못했습니다. 신청자에게 직접 알려 주세요.", NotificationType.Warning)
                                                  ),
                                                  Notify("이 센터의 승인을 기록했습니다. 상대 센터의 승인을 기다립니다.", NotificationType.Success)
                                              )
                                          )
                                      )
                                  )
                              );
                              ClearCollect(colAdminReqs, Filter(VisitRequests, VisitDate >= DateAdd(Today(), -180, TimeUnit.Days)));
                              Set(gSel, LookUp(colAdminReqs, ID = gSel.ID));
                              UpdateContext({locWorking: false})
                          )
                        Font: =fnt
                        Size: =10.5
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        Fill: =cPrimary
                        Color: =cSurface
                        HoverFill: =cPrimaryHover
                        PressedFill: =cPrimaryHover
                        HoverColor: =cSurface
                        PressedColor: =cSurface
                        BorderThickness: =0
