- btnNext:
    Control: Classic/Button@2.2.0
    Properties:
      Text: =If(gStep = 3, "신청하기", "다음")
      X: =1222
      Y: =716
      Width: =120
      Height: =40
      OnSelect: |-
        =Switch(
            gStep,
            1, If(IsBlank(gDate) || IsBlank(gSlot), Notify("방문일과 시간을 선택해 주세요.", NotificationType.Warning), Set(gStep, 2)),
            2, With(
            {
                msg: If(
                    IsBlank(txtHostName.Text) || IsBlank(txtHostTitle.Text) || IsBlank(txtHostDivision.Text) || IsBlank(txtHostOrg.Text),
                    "신청 담당자의 성함 · 직책 · 담당(실) · 조직명을 입력해 주세요.",
                    IsBlank(txtHostPhone.Text), "신청 담당자 연락처를 입력해 주세요.",
                    !IsMatch(Trim(txtHostEmail.Text), Match.Email), "신청 담당자 이메일을 정확히 입력해 주세요.",
                    gCategory = "external" && IsBlank(gClientType), "고객 유형(기존 / 신규)을 선택해 주세요.",
                    gCategory = "external" && IsBlank(txtCompany.Text), "업체명을 입력해 주세요.",
                    gCategory = "external" && IsBlank(gIndustry), "업종을 선택해 주세요.",
                    gCategory = "external" && gIndustry = "기타" && IsBlank(Trim(txtIndustryEtc.Text)), "기타 업종을 입력해 주세요.",
                    IsBlank(gPurpose), "방문 목적을 선택해 주세요.",
                    gPurpose = "기타" && IsBlank(Trim(txtPurposeEtc.Text)), "기타 방문 목적을 입력해 주세요.",
                    Value(txtHeadcount.Text) < 1, "예상 방문 인원을 입력해 주세요.",
                    ""
                )
            },
            If(IsBlank(msg), Set(gStep, 3), Notify(msg, NotificationType.Warning))
        ),
            3, If(
            !chkConsent.Value,
            Notify("개인정보 수집 · 이용에 동의해 주세요.", NotificationType.Warning),
            With(
                {no: "V" & Text(Now(), "yymmdd-hhmmss")},
                Set(
                    gSaved,
                    Patch(
                        VisitRequests,
                        Defaults(VisitRequests),
                        {
                            Title: no,
                            Tour: gTour.Id,
                            TourName: gTour.Name,
                            VisitDate: gDate,
                            DateKey: Text(gDate, "yyyy-mm-dd"),
                            Slot: gSlot.Slot,
                            ScheduleText: gSlot.Show,
                            CFrom: gSlot.CFrom, CTo: gSlot.CTo,
                            LFrom: gSlot.LFrom, LTo: gSlot.LTo,
                            MFrom: gSlot.MFrom, MTo: gSlot.MTo,
                            ForMain: If(gTour.Main, "Y", "N"),
                            ForMtv: If(gTour.Mtv, "Y", "N"),
                            ApproveMain: If(gTour.Main, "대기", ""),
                            ApproveMtv: If(gTour.Mtv, "대기", ""),
                            Category: If(gCategory = "external", "고객 방문", "내부 방문"),
                            ClientType: If(gCategory = "external", If(gClientType = "new", "신규 고객사", "기존 고객사"), ""),
                            Company: If(gCategory = "external", Trim(txtCompany.Text), Trim(txtHostDivision.Text & " " & txtHostOrg.Text)),
                            Industry: If(gCategory = "external", If(gIndustry = "기타", "기타: " & Trim(txtIndustryEtc.Text), gIndustry), ""),
                            Purpose: If(gPurpose = "기타", "기타: " & Trim(txtPurposeEtc.Text), gPurpose),
                            Language: LookUp(Languages, Id = gLang, Name),
                            Interpreter: If(chkInterp.Value, "Y", "N"),
                            InterpreterLanguage: If(chkInterp.Value, Trim(txtInterpLang.Text), ""),
                            HostName: Trim(txtHostName.Text),
                            HostTitle: Trim(txtHostTitle.Text),
                            HostDivision: Trim(txtHostDivision.Text),
                            HostOrg: Trim(txtHostOrg.Text),
                            HostPhone: Trim(txtHostPhone.Text),
                            HostEmail: Lower(Trim(txtHostEmail.Text)),
                            ApplicantEmail: Lower(User().Email),
                            HostComment: txtComment.Text,
                            ExpectedHeadcount: Value(txtHeadcount.Text),
                            AttendeeCount: 0,
                            Status: "대기",
                            FormsLink: Substitute(FormsPrefillUrl, "REQNO", no),
                            AdminMemo: "",
                            ConsentAt: Now()
                        }
                    )
                );
                If(
                    IsEmpty(Errors(VisitRequests)),
                    TDLVisitSubmitted.Run(gSaved.ID, Coalesce(Trim(txtAttendeeEmails.Text), "-"));
                    Navigate(scrDone, ScreenTransition.Fade),
                    Notify("저장하지 못했습니다. " & First(Errors(VisitRequests)).Message, NotificationType.Error)
                )
            )
        )
        )
      Font: =fnt
      Size: =10.5
      FontWeight: =FontWeight.Semibold
      RadiusTopLeft: =6
      RadiusTopRight: =6
      RadiusBottomLeft: =6
      RadiusBottomRight: =6
      Fill: =cPrimary
      Color: =cSurface
      HoverFill: =cPrimaryHover
      PressedFill: =cPrimaryHover
      HoverColor: =cSurface
      PressedColor: =cSurface
      BorderThickness: =0
      DisabledFill: =cSoft
      DisabledColor: =cInk3
