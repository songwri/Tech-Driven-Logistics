# scrBook — 방문 신청 (3단계)
# 1) 트리 뷰에서 새 화면(빈 화면)을 만들고 이름을 scrBook 으로 바꿉니다.
# 2) 화면 속성: Fill = cBg
#    OnVisible = If(gNeedReset, Reset(txtHostName); Reset(txtHostTitle); Reset(txtHostDivision); Reset(txtHostOrg); Reset(txtHostPhone); Reset(txtHostEmail); Reset(txtCompany); Reset(txtIndustryEtc); Reset(txtPurposeEtc); Reset(txtInterpLang); Reset(chkInterp); Reset(txtHeadcount); Reset(txtComment); Reset(txtAttendeeEmails); Reset(chkConsent); Set(gNeedReset, false))
# 3) 이 파일 내용을 전부 복사 → 트리 뷰에서 scrBook 을 오른쪽 클릭 → '붙여넣기'(Ctrl+V)
