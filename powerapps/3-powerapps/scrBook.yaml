      - galWeekdays:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =["일", "월", "화", "수", "목", "금", "토"]
            X: =22
            Y: =60
            Width: =476
            Height: =24
            TemplateSize: =24
            TemplatePadding: =0
            ShowScrollbar: =false
            BorderThickness: =0
            Fill: =Color.Transparent
            WrapCount: =7
          Children:
            - lblWeekday:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Value
                  X: =0
                  Y: =0
                  Width: =68
                  Height: =24
                  Font: =fnt
                  Size: =9
                  Color: =cInk2
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  Align: =Align.Center
      - galCal:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: |-
              =With(
                  {start: DateAdd(gMonth, 1 - Weekday(gMonth), TimeUnit.Days), earliest: If(gTour.Mtv, EarliestMtv, EarliestBase)},
                  ForAll(
                      Sequence(42, 0) As n,
                      With(
                          {d: DateAdd(start, n.Value, TimeUnit.Days)},
                          With(
                              {k: Text(d, "yyyy-mm-dd"), open: Weekday(d) in [2, 4, 6] && d >= earliest && !(Text(d, "yyyy-mm-dd") in HolidayKeys.Value)},
                              {
                                  D: d,
                                  Key: k,
                                  InMonth: Month(d) = Month(gMonth),
                                  Open: open,
                                  Free: If(
                                      open,
                                      CountRows(
                                          Filter(
                                              TourSlots As s,
                                              s.Tour = gTour.Id && IsEmpty(Filter(colBusy As b, b.DateKey = k && ((s.CFrom >= 0 && b.CFrom >= 0 && s.CFrom < b.CTo && b.CFrom < s.CTo) || (s.LFrom >= 0 && b.LFrom >= 0 && s.LFrom < b.LTo && b.LFrom < s.LTo) || (s.MFrom >= 0 && b.MFrom >= 0 && s.MFrom < b.MTo && b.MFrom < s.MTo))))
                                          )
                                      ),
                                      0
                                  )
                              }
                          )
                      )
                  )
              )
            X: =22
            Y: =88
            Width: =476
            Height: =348
            TemplateSize: =58
            TemplatePadding: =0
            ShowScrollbar: =false
            BorderThickness: =0
            Fill: =Color.Transparent
            WrapCount: =7
            OnSelect: =If((ThisItem.Open && ThisItem.Free > 0) && ThisItem.InMonth, Set(gDate, ThisItem.D); Set(gSlot, Blank()))
          Children:
            - btnDay:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  X: =3
                  Y: =3
                  Width: =Parent.TemplateWidth - 6
                  Height: =52
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.InMonth
                  Fill: =If((!IsBlank(gDate) && ThisItem.Key = Text(gDate, "yyyy-mm-dd")), cPrimary, (ThisItem.Open && ThisItem.Free > 0), cSurface, ThisItem.Open, cSoft, Color.Transparent)
                  HoverFill: =If((!IsBlank(gDate) && ThisItem.Key = Text(gDate, "yyyy-mm-dd")), cPrimaryHover, (ThisItem.Open && ThisItem.Free > 0), cSoft, ThisItem.Open, cSoft, Color.Transparent)
                  PressedFill: =If((!IsBlank(gDate) && ThisItem.Key = Text(gDate, "yyyy-mm-dd")), cPrimaryHover, cSoft)
                  BorderColor: =If((ThisItem.Open && ThisItem.Free > 0) && !(!IsBlank(gDate) && ThisItem.Key = Text(gDate, "yyyy-mm-dd")), cLine, Color.Transparent)
                  BorderThickness: =1
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
            - lblDayNum:
                Control: Label@2.5.1
                Properties:
                  Text: =Day(ThisItem.D)
                  X: =3
                  Y: =9
                  Width: =Parent.TemplateWidth - 6
                  Height: =20
                  Font: =fnt
                  Size: =10.5
                  Color: =If((!IsBlank(gDate) && ThisItem.Key = Text(gDate, "yyyy-mm-dd")), cSurface, (ThisItem.Open && ThisItem.Free > 0), cInk, ThisItem.Open, cInk3, ColorValue("#CFCDC8"))
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  PaddingBottom: =0
                  Align: =Align.Center
                  Visible: =ThisItem.InMonth
                  OnSelect: =Select(Parent)
            - lblDaySub:
                Control: Label@2.5.1
                Properties:
                  Text: =If((!IsBlank(gDate) && ThisItem.Key = Text(gDate, "yyyy-mm-dd")), "선택", !ThisItem.Open, "", ThisItem.Free > 0, "가능", "마감")
                  X: =3
                  Y: =31
                  Width: =Parent.TemplateWidth - 6
                  Height: =16
                  Font: =fnt
                  Size: =7.5
                  Color: =If((!IsBlank(gDate) && ThisItem.Key = Text(gDate, "yyyy-mm-dd")), cSurface, ThisItem.Free > 0, cGreen, cRed)
                  PaddingLeft: =0
