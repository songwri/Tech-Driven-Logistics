# scrDone — 신청 완료
# ── [PA 전용] 웹앱에 없는 기능 · 수정하면 이 목록과 수식 속 '// [PA 전용]' 주석도 함께 고칠 것 (README 14) ──
#   · 완료 화면의 Forms 링크 복사: 참석자가 Forms 로 직접 입력 · 동의 (웹은 신청자가 명단 대리 입력)
#   · conDBody: 본문만 스크롤 · 폭은 창 폭에 맞춰 kx 배(최대 MaxStretch)로 늘어남
# 1) 새 화면(빈 화면) → 이름 scrDone, 화면 Fill = cBg, Width = sw, Height = sh
# 2) 이 파일 내용을 전부 복사 → 트리 뷰에서 scrDone 오른쪽 클릭 → '붙여넣기'
- conDBody:
    Control: GroupContainer@1.3.0
    Variant: AutoLayout
    Properties:
      X: =0
      Y: =56
      Width: =sw
      Height: =sh - 56
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutOverflowY: =LayoutOverflow.Scroll // [PA 전용] 본문 스크롤 레이아웃. 웹은 페이지 스크롤
      Fill: =Color.Transparent
      BorderThickness: =0
      DropShadow: =DropShadow.None
    Children:
      - conDPage:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            Width: =pw
            Height: =656
            FillPortions: =0
            Fill: =Color.Transparent
            BorderThickness: =0
            DropShadow: =DropShadow.None
          Children:
            - conDone:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  X: =(pw - 720) / 2
                  Y: =40
                  Width: =720
                  Height: =600
                  Fill: =cSurface
                  BorderColor: =cLine
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                Children:
                  - icoDone:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        Icon: =Icon.Check
                        X: =328
                        Y: =36
                        Width: =64
                        Height: =64
                        Color: =cGreen
                        Fill: =cGreenBg
                        PaddingLeft: =18
                        PaddingRight: =18
                        PaddingTop: =18
                        PaddingBottom: =18
                        RadiusTopLeft: =32
                        RadiusTopRight: =32
                        RadiusBottomLeft: =32
                        RadiusBottomRight: =32
                  - lblDoneTitle:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="신청이 접수되었습니다"
                        X: =0
                        Y: =116
                        Width: =720
                        Height: =36
                        Font: =fnt
                        Size: =16.5
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        FontWeight: =FontWeight.Semibold
                        Align: =Align.Center
                  - lblDoneSub:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="신청번호 " & gSaved.Title & " · " & gSaved.TourName & " · " & Month(gSaved.VisitDate) & "월 " & Day(gSaved.VisitDate) & "일 (" & Text(gSaved.VisitDate, "ddd", "ko-KR") & ")" & " " & gSaved.ScheduleText
                        X: =0
                        Y: =156
                        Width: =720
                        Height: =22
                        Font: =fnt
                        Size: =10.5
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        Align: =Align.Center
                  - lblDoneLink:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="참석자 정보 입력 링크 (Forms)"
                        X: =40
                        Y: =206
                        Width: =400
                        Height: =20
                        Font: =fnt
                        Size: =9
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                  - txtDoneLink:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: =gSaved.FormsLink
                        HintText: =""
                        X: =40
                        Y: =228
                        Width: =520
                        Height: =36
                        Font: =Font.Consolas
                        Size: =9
                        Color: =cInk
                        Fill: =cSurface
                        BorderColor: =cLine
                        HoverBorderColor: =cInk3
                        FocusedBorderColor: =cInk
                        BorderThickness: =1
                        FocusedBorderThickness: =1
                        PaddingLeft: =10
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        DisplayMode: =DisplayMode.View
                  - btnDoneCopy:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="링크 복사"
                        X: =572
                        Y: =226
                        Width: =108
                        Height: =40
                        OnSelect: |-
                          =// [PA 전용] 참석자 Forms 링크 복사. 웹은 신청자가 방문자 명단을 직접 입력
                          Copy(gSaved.FormsLink);
                          Notify("링크를 복사했습니다. 참석자에게 전달해 주세요.", NotificationType.Success)
