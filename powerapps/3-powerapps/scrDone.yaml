                        Size: =10.5
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        Fill: =cPrimary
                        Color: =cSurface
                        HoverFill: =cPrimaryHover
                        PressedFill: =cPrimaryHover
                        HoverColor: =cSurface
                        PressedColor: =cSurface
                        BorderThickness: =0
