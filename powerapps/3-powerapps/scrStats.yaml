                      Properties:
                        Text: =Sum(Filter(Filter(colStatAll, If(gStatBasis = "approved", Status = "승인" || Status = "완료", Status <> "거절" && Status <> "취소")), DayNum >= Value(lblStatS.Text) && DayNum <= Value(lblStatE.Text)), Heads) & "명"
                        X: =18
                        Y: =34
                        Width: =290 + 320 * (kx - 1)
                        Height: =30
                        Font: =fnt
                        Size: =18
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
