                        Y: =8
                        Width: =150
                        Height: =36
                        DefaultDate: =Date(Year(Today()), Month(Today()), 1)
                        Format: =DateTimeFormat.ShortDate
                        Font: =fnt
                        Size: =9.75
                        Color: =cInk
                        BorderColor: =cLine
                        IconFill: =cInk
                        IconBackground: =cSurface
                        Visible: =gStatPeriod = "range"
                  - lblStatTilde:
