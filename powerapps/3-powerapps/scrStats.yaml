                        Font: =fnt
                        Size: =9.75
                        Fill: =If(gStatPeriod = "year", cPrimary, cSurface)
                        Color: =If(gStatPeriod = "year", cSurface, cInk)
                        HoverFill: =If(gStatPeriod = "year", cPrimaryHover, cSoft)
                        HoverColor: =If(gStatPeriod = "year", cSurface, cInk)
                        PressedFill: =If(gStatPeriod = "year", cPrimaryHover, cSoft)
                        PressedColor: =If(gStatPeriod = "year", cSurface, cInk)
                        BorderColor: =If(gStatPeriod = "year", cPrimary, cLine)
                        HoverBorderColor: =If(gStatPeriod = "year", cPrimary, cInk3)
