                        Y: =10
                        Width: =132
                        Height: =32
                        OnSelect: =Set(gStatBasis, "approved")
                        Font: =fnt
                        Size: =9.75
                        Fill: =If(gStatBasis = "approved", cPrimary, cSurface)
                        Color: =If(gStatBasis = "approved", cSurface, cInk)
                        HoverFill: =If(gStatBasis = "approved", cPrimaryHover, cSoft)
                        HoverColor: =If(gStatBasis = "approved", cSurface, cInk)
                        PressedFill: =If(gStatBasis = "approved", cPrimaryHover, cSoft)
                        PressedColor: =If(gStatBasis = "approved", cSurface, cInk)
                        BorderColor: =If(gStatBasis = "approved", cPrimary, cLine)
                        HoverBorderColor: =If(gStatBasis = "approved", cPrimary, cInk3)
                        BorderThickness: =1
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
            - conKpiCount:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  X: =24
                  Y: =80
                  Width: =320 * kx
                  Height: =92
                  Fill: =cSurface
                  BorderColor: =cLine
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                Children:
                  - lblKpiCountTitle:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If(gStatBasis = "approved", "승인 · 완료 건수", "신청 건수")
                        X: =18
                        Y: =14
                        Width: =290 + 320 * (kx - 1)
                        Height: =20
                        Font: =fnt
                        Size: =9
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                  - lblKpiCountValue:
                      Control: Label@2.5.1
                      Properties:
                        Text: =CountRows(Filter(Filter(colStatAll, If(gStatBasis = "approved", Status = "승인" || Status = "완료", Status <> "거절" && Status <> "취소")), DayNum >= Value(lblStatS.Text) && DayNum <= Value(lblStatE.Text))) & "건"
                        X: =18
                        Y: =34
                        Width: =290 + 320 * (kx - 1)
                        Height: =30
                        Font: =fnt
                        Size: =18
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        FontWeight: =FontWeight.Semibold
                  - lblKpiCountNote:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =If(Value(lblStatPS.Text) < 0, "비교 기간 없음", With({d: CountRows(Filter(Filter(colStatAll, If(gStatBasis = "approved", Status = "승인" || Status = "완료", Status <> "거절" && Status <> "취소")), DayNum >= Value(lblStatS.Text) && DayNum <= Value(lblStatE.Text))) - CountRows(Filter(Filter(colStatAll, If(gStatBasis = "approved", Status = "승인" || Status = "완료", Status <> "거절" && Status <> "취소")), DayNum >= Value(lblStatPS.Text) && DayNum <= Value(lblStatPE.Text)))}, Switch(gStatPeriod, "year", "전년", "month", "전월", "직전 동기간") & " 대비 " & If(d > 0, "▲ ", d < 0, "▼ ", "– ") & Abs(d)))
                        X: =18
                        Y: =66
                        Width: =290 + 320 * (kx - 1)
                        Height: =20
                        Font: =fnt
                        Size: =9
                        Color: =cInk3
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
            - conKpiPeople:
