                        HoverColor: =If(gStatPeriod = "all", cSurface, cInk)
                        PressedFill: =If(gStatPeriod = "all", cPrimaryHover, cSoft)
                        PressedColor: =If(gStatPeriod = "all", cSurface, cInk)
                        BorderColor: =If(gStatPeriod = "all", cPrimary, cLine)
                        HoverBorderColor: =If(gStatPeriod = "all", cPrimary, cInk3)
                        BorderThickness: =1
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                  - btnStatPrev:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="‹"
                        X: =384
                        Y: =10
                        Width: =32
                        Height: =32
