                      Properties:
                        X: =562
                        Y: =8
                        Width: =150
                        Height: =36
                        DefaultDate: =Today()
                        Format: =DateTimeFormat.ShortDate
                        Font: =fnt
                        Size: =9.75
                        Color: =cInk
                        BorderColor: =cLine
                        IconFill: =cInk
                        IconBackground: =cSurface
                        Visible: =gStatPeriod = "range"
                  - lblStatBasis:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="집계 기준"
                        X: =980 + 1318 * (kx - 1)
                        Y: =16
                        Width: =70
                        Height: =20
                        Font: =fnt
                        Size: =9
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                  - btnBasisAll:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="전체"
                        X: =1050 + 1318 * (kx - 1)
                        Y: =10
                        Width: =110
                        Height: =32
                        OnSelect: =Set(gStatBasis, "all")
                        Font: =fnt
                        Size: =9.75
                        Fill: =If(gStatBasis = "all", cPrimary, cSurface)
                        Color: =If(gStatBasis = "all", cSurface, cInk)
                        HoverFill: =If(gStatBasis = "all", cPrimaryHover, cSoft)
                        HoverColor: =If(gStatBasis = "all", cSurface, cInk)
                        PressedFill: =If(gStatBasis = "all", cPrimaryHover, cSoft)
                        PressedColor: =If(gStatBasis = "all", cSurface, cInk)
                        BorderColor: =If(gStatBasis = "all", cPrimary, cLine)
                        HoverBorderColor: =If(gStatBasis = "all", cPrimary, cInk3)
                        BorderThickness: =1
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                  - btnBasisOk:
                      Control: Classic/Button@2.2.0
                      Properties:
