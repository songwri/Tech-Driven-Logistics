                        Width: =290 + 320 * (kx - 1)
                        Height: =20
                        Font: =fnt
                        Size: =9
                        Color: =cInk3
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
