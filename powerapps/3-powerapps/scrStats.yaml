- lblStatE:
    Control: Label@2.5.1
    Properties:
      Text: |-
        =Switch(
            gStatPeriod,
            "year", Text(gStatYear * 10000 + 1231),
            "month", Text(DateAdd(Date(gStatYear, gStatMonth + 1, 1), -1, TimeUnit.Days), "yyyymmdd"),
            "range", Text(If(dpStatFrom.SelectedDate <= dpStatTo.SelectedDate, dpStatTo.SelectedDate, dpStatFrom.SelectedDate), "yyyymmdd"),
            "99999999"
        )
      X: =0
