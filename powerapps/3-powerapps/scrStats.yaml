                  Y: =16
                  Width: =1318 * kx
                  Height: =52
                  Fill: =cSurface
                  BorderColor: =cLine
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
