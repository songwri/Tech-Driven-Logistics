# scrStats — 방문 통계 (관리자만). 웹 관리자 '통계' 탭과 같은 기간 선택: 연간 · 월별 · 기간 지정 · 전체 기간
# ── [PA 전용] 웹앱에 없는 기능 · 수정하면 이 목록과 수식 속 '// [PA 전용]' 주석도 함께 고칠 것 (README 14) ──
#   · OnVisible: 목록을 해마다 나눠 읽음 (SharePoint 2000행 제한 회피, 웹은 시트 전체를 읽음)
#   · conSBody: 본문만 스크롤 · 폭은 창 폭에 맞춰 kx 배(최대 MaxStretch)로 늘어남
#   · 통계 레이아웃: 탭 없이 한 화면(스크롤) · 카드 높이를 내용에 맞춤 · 막대는 가장 큰 항목만 강조 · 값 큰 순 정렬 · 건수 옆 비율(%) · 투어는 투어 색 · 기간 필터를 한 번만 계산(base)
#   · hdrSAdmZone · hdrSAdmLabel: 관리자 메뉴(예약 관리 · 달력 · 통계 · 가이드 배정 · 방명록 관리)를 오른쪽 묶음 + 관리자 표시로 구분 (관리자만 보임)
# 1) 새 화면(빈 화면) → 이름 scrStats, 화면 Fill = cBg, Width = sw, Height = sh
#    OnVisible =
#      If(IsBlank(gAdminSite), Notify("관리자 권한이 없습니다.", NotificationType.Error); Navigate(scrBook),
#         Clear(colStatRaw);
#         Clear(colStatAtt);
#         ForAll(
#             Sequence(Year(Today()) - 2019 + 2, 2019) As y,
#             With(
#                 {s: Date(y.Value, 1, 1), e: Date(y.Value + 1, 1, 1)},
#                 Collect(
#                     colStatRaw,
#                     Switch(
#                         gAdminSite,
#                         "main", Filter(VisitRequests, VisitDate >= s && VisitDate < e && ForMain = "Y"),
#                         "mtv", Filter(VisitRequests, VisitDate >= s && VisitDate < e && ForMtv = "Y"),
#                         Filter(VisitRequests, VisitDate >= s && VisitDate < e)
#                     )
#                 );
#                 Collect(colStatAtt, ShowColumns(Filter(VisitAttendees, VisitDate >= s && VisitDate < e), RequestNo, Jobs))
#             )
#         );
#         ClearCollect(colStatAll, AddColumns(colStatRaw,
#             DayNum, Value(Substitute(DateKey, "-", "")),
#             Heads, If(AttendeeCount > 0, AttendeeCount, ExpectedHeadcount),
#             Seg, If(Category = "내부 방문", "내부 방문", ClientType = "신규 고객사", "고객 · 신규", ClientType = "기존 고객사", "고객 · 기존", "고객 · 미분류"),
#             LangLabel, If(Language = "한국어", If(Interpreter = "Y", "한국어 · 통역 동반", "한국어"), Language),
#             DivGroup, With({k0: Lower(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(HostDivision, " ", ""), "/", ""), "·", ""), "-", ""), ".", ""), "_", ""))},
#                 With({k1: If(StartsWith(k0, "cl"), Mid(k0, 3), k0)},
#                     With({k: If(EndsWith(k1, "담당"), Left(k1, Len(k1) - 2), k1)},
#                         Switch(k, "전자", "CL전자담당", "lglx", "CL LG/LX담당", "lxlg", "CL LG/LX담당", "영업", "CL영업담당", "운영", "CL운영담당", "컨설팅", "CL컨설팅담당", "ec사업", "EC사업담당", "ec", "EC사업담당", "기타"))))));
#         Clear(colStatRaw))
#    (목록을 해마다 나눠 읽습니다. 한 번에 읽으면 SharePoint 에서 최대 2000행까지만 가져와 오래 쓰면 통계가 조용히 틀어집니다.
#     2019년 이전 이력을 넣었다면 2019 를 그 해로 바꾸세요.)
# 2) 이 파일 내용을 전부 복사 → 트리 뷰에서 scrStats 오른쪽 클릭 → '붙여넣기'
- conSBody:
    Control: GroupContainer@1.3.0
    Variant: AutoLayout
    Properties:
      X: =0
      Y: =56
      Width: =sw
      Height: =sh - 56
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutOverflowY: =LayoutOverflow.Scroll // [PA 전용] 본문 스크롤 레이아웃. 웹은 페이지 스크롤
      Fill: =Color.Transparent
      BorderThickness: =0
      DropShadow: =DropShadow.None
