                        Font: =fnt
                        Size: =10.5
                        FontWeight: =FontWeight.Semibold
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        Fill: =cSurface
                        Color: =cInk
                        HoverFill: =cSoft
                        PressedFill: =cSoft
                        HoverColor: =cInk
                        PressedColor: =cInk
                        BorderColor: =cLine
                        HoverBorderColor: =cInk3
                        BorderThickness: =1
                        DisabledFill: =cSurface
                        DisabledColor: =cInk3
                        DisabledBorderColor: =cLine
                        Visible: =gStatPeriod = "year" || gStatPeriod = "month"
                  - lblStatNav:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If(gStatPeriod = "year", gStatYear & "년", gStatYear & "년 " & gStatMonth & "월")
                        X: =420
                        Y: =10
                        Width: =130
                        Height: =32
                        Font: =fnt
                        Size: =10.5
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
