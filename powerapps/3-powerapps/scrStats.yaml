                  - lblKpiRateTitle:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="승인률"
                        X: =18
                        Y: =14
                        Width: =290 + 320 * (kx - 1)
                        Height: =20
                        Font: =fnt
                        Size: =9
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                  - lblKpiRateValue:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =With({d: CountRows(Filter(Filter(colStatAll, DayNum >= Value(lblStatS.Text) && DayNum <= Value(lblStatE.Text)), Status = "승인" || Status = "완료" || Status = "거절"))}, If(d > 0, Round(CountRows(Filter(Filter(colStatAll, DayNum >= Value(lblStatS.Text) && DayNum <= Value(lblStatE.Text)), Status = "승인" || Status = "완료")) / d * 100, 0), 0)) & "%"
                        X: =18
                        Y: =34
                        Width: =290 + 320 * (kx - 1)
                        Height: =30
                        Font: =fnt
                        Size: =18
                        Color: =cInk
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
                        FontWeight: =FontWeight.Semibold
                  - lblKpiRateNote:
