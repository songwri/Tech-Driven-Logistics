                        X: =538
                        Y: =10
                        Width: =20
                        Height: =32
                        Font: =fnt
                        Size: =10.5
                        Color: =cInk2
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        PaddingBottom: =0
