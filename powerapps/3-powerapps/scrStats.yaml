                        Font: =fnt
                        Size: =9.75
                        Fill: =If(gStatPeriod = "month", cPrimary, cSurface)
                        Color: =If(gStatPeriod = "month", cSurface, cInk)
                        HoverFill: =If(gStatPeriod = "month", cPrimaryHover, cSoft)
                        HoverColor: =If(gStatPeriod = "month", cSurface, cInk)
                        PressedFill: =If(gStatPeriod = "month", cPrimaryHover, cSoft)
                        PressedColor: =If(gStatPeriod = "month", cSurface, cInk)
