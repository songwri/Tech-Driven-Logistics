                        Font: =fnt
                        Size: =9.75
                        Fill: =If(gStatPeriod = "range", cPrimary, cSurface)
                        Color: =If(gStatPeriod = "range", cSurface, cInk)
                        HoverFill: =If(gStatPeriod = "range", cPrimaryHover, cSoft)
                        HoverColor: =If(gStatPeriod = "range", cSurface, cInk)
                        PressedFill: =If(gStatPeriod = "range", cPrimaryHover, cSoft)
                        PressedColor: =If(gStatPeriod = "range", cSurface, cInk)
