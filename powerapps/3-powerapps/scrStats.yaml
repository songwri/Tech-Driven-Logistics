- lblStatPS:
    Control: Label@2.5.1
    Properties:
      Text: |-
        =With(
            {
                a: If(dpStatFrom.SelectedDate <= dpStatTo.SelectedDate, dpStatFrom.SelectedDate, dpStatTo.SelectedDate),
                b: If(dpStatFrom.SelectedDate <= dpStatTo.SelectedDate, dpStatTo.SelectedDate, dpStatFrom.SelectedDate)
            },
            Switch(
                gStatPeriod,
                "year", Text((gStatYear - 1) * 10000 + 101),
                "month", Text(Date(gStatYear, gStatMonth - 1, 1), "yyyymmdd"),
                "range", Text(DateAdd(a, -(DateDiff(a, b, TimeUnit.Days) + 1), TimeUnit.Days), "yyyymmdd"),
                "-1"
            )
        )
      X: =0
      Y: =0
      Width: =1
      Height: =1
      Font: =fnt
      Size: =10.5
      Color: =cInk
      PaddingLeft: =0
      PaddingRight: =0
      PaddingTop: =0
      PaddingBottom: =0
      Visible: =false
- lblStatPE:
    Control: Label@2.5.1
    Properties:
      Text: |-
        =With(
            {a: If(dpStatFrom.SelectedDate <= dpStatTo.SelectedDate, dpStatFrom.SelectedDate, dpStatTo.SelectedDate)},
            Switch(
                gStatPeriod,
                "year", Text((gStatYear - 1) * 10000 + 1231),
                "month", Text(DateAdd(Date(gStatYear, gStatMonth, 1), -1, TimeUnit.Days), "yyyymmdd"),
                "range", Text(DateAdd(a, -1, TimeUnit.Days), "yyyymmdd"),
                "-1"
            )
        )
      X: =0
      Y: =0
      Width: =1
      Height: =1
      Font: =fnt
      Size: =10.5
      Color: =cInk
      PaddingLeft: =0
      PaddingRight: =0
      PaddingTop: =0
      PaddingBottom: =0
      Visible: =false
