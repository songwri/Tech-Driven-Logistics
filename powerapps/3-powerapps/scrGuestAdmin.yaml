# scrGuestAdmin — 방명록 관리 (관리자만). 웹 /admin/ 의 '방명록' 탭과 같은 구성
#   · 위: 전체 · 공개 중 · 숨김 · 평균 평가 (투어를 고르면 그 투어 기준)
#   · 투어 필터(전체 · 투어별 · 미분류, 건수), 공개 상태 필터(전체 · 공개 · 숨김), 이름 · 회사 · 팀 · 메시지 검색
#   · 표: 작성일 · 투어 · 평가 · 작성자(실명 · 소속 · 공개 표시) · 메시지 · 상태 · 처리(숨기기 / 다시 표시 · 삭제 확인)
# ── [PA 전용] 웹앱에 없는 기능 · 수정하면 이 목록과 수식 속 '// [PA 전용]' 주석도 함께 고칠 것 (README 14) ──
#   · btnGbAdmToggle: 숨기면 공개용 GuestbookPublic 행을 지우고, 다시 표시하면 가명 행을 다시 만듦 (웹은 시트 숨김 열 하나)
#   · btnGbAdmExcel: SharePoint 목록을 열어 '내보내기 → CSV/Excel' (웹은 화면에서 바로 엑셀 파일)
#   · conGABody: 본문만 스크롤 · 폭은 창 폭에 맞춰 kx 배
#   · hdrGAAdmZone · hdrGAAdmLabel: 관리자 메뉴(예약 관리 · 달력 · 통계 · 방명록 관리)를 오른쪽 묶음 + 관리자 표시로 구분 (관리자만 보임)
# 1) 새 화면(빈 화면) → 이름 scrGuestAdmin, 화면 Fill = cBg, Width = sw, Height = sh
#    OnVisible =
#      If(IsBlank(gAdminSite), Notify("관리자 권한이 없습니다.", NotificationType.Error); Navigate(scrGuest),
#         Set(gGbAdmTour, "all"); Set(gGbAdmFilter, "all"); Set(gGbConfirmId, 0);
#         ClearCollect(colGb, FirstN(SortByColumns(Guestbook, "Created", SortOrder.Descending), 2000)))
# 2) 이 파일 내용을 전부 복사 → 트리 뷰에서 scrGuestAdmin 오른쪽 클릭 → '붙여넣기'
