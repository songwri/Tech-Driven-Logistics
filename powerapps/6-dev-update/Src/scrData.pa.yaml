                  - btnDaFind:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =0
                        Color: =cWhite
                        DisabledColor: =cWhite
                        DisabledFill: =cInk3
                        DisplayMode: =If(gDaWorking, DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =cPrimary
                        Font: =Font.'Segoe UI'
                        Height: =36
                        HoverColor: =cWhite
                        HoverFill: =cPrimaryHover
                        OnSelect: |-
                          =If(!varIsDataAdmin, Notify("이 작업을 할 권한이 없습니다.", NotificationType.Error), Set(gDaWorking, true);
                          Set(gDaQ, Trim(txtDaNo.Text));
                          Set(gDaEdit, false);
                          Set(gDaMsg, "");
                          IfError(
                              If(
                                  IsBlank(gDaQ),
                                  ClearCollect(colDaReq, FirstN(VisitRequests, 0));
                                  ClearCollect(colDaAtt, FirstN(VisitAttendees, 0));
                                  ClearCollect(colDaBusy, FirstN(TourBusy, 0)),
                                  ClearCollect(colDaReq, If(chkDaSub.Value, Filter(FirstN(VisitRequests, 2000), gDaQ in Title), Filter(VisitRequests, StartsWith(Title, gDaQ))));
                                  ClearCollect(colDaAtt, If(chkDaSub.Value, Filter(FirstN(VisitAttendees, 2000), gDaQ in RequestNo), Filter(VisitAttendees, StartsWith(RequestNo, gDaQ))));
                                  ClearCollect(colDaBusy, If(chkDaSub.Value, Filter(FirstN(TourBusy, 2000), gDaQ in Title), Filter(TourBusy, StartsWith(Title, gDaQ))))
                              ),
                              Notify("조회하지 못했습니다: " & FirstError.Message, NotificationType.Error)
                          );
                          IfError(
                              ClearCollect(colDaNos, ForAll(FirstN(VisitRequests, 2000), {No: Title, Exp: ExpectedHeadcount}));
                              ClearCollect(colDaOrphan, Filter(FirstN(VisitAttendees, 2000), Status = "미매칭" || (Status <> "연결됨" && !(RequestNo in colDaNos.No))));
                              ClearCollect(colDaBusyAll, FirstN(TourBusy, 0));
                              ForAll(Distinct(colDaReq, DateKey) As d, Collect(colDaBusyAll, Filter(TourBusy, DateKey = d.Value)));
                              If(Len(Trim(txtDaDate.Text)) > 0, Collect(colDaBusyAll, Filter(TourBusy, DateKey = Trim(txtDaDate.Text))));
                              Collect(
                                  colDaBusy,
                                  Filter(
                                      colDaBusyAll As bb,
                                      !(bb.ID in colDaBusy.ID) && (
                                          (Len(Trim(txtDaDate.Text)) > 0 && bb.DateKey = Trim(txtDaDate.Text)) ||
                                          !IsBlank(LookUp(colDaReq As rr, rr.DateKey = bb.DateKey && ((rr.CFrom < bb.CTo && bb.CFrom < rr.CTo) || (rr.LFrom < bb.LTo && bb.LFrom < rr.LTo) || (rr.MFrom < bb.MTo && bb.MFrom < rr.MTo))))
                                      )
                                  )
                              ),
                              Notify("일부 정보(매칭 안 된 응답·겹치는 점유)를 불러오지 못했습니다: " & FirstError.Message, NotificationType.Warning)
                          );
                          IfError(
                              ClearCollect(
                                  colDaAttV,
                                  AddColumns(
                                      colDaAtt,
                                      St,
                                      With(
                                          {rno: RequestNo, rid: ID, st: Coalesce(Status, ""), rq: LookUp(colDaNos, No = RequestNo)},
                                          If(
                                              st = "미매칭" || (st <> "연결됨" && IsBlank(rq)),
                                              "미매칭",
                                              If(!IsBlank(rq) && CountRows(Filter(colDaAtt, RequestNo = rno, ID <= rid, Coalesce(Status, "") <> "미매칭")) > rq.Exp, "추가", If(st = "연결됨", "연결됨", "정상"))
                                          )
                                      )
                                  )
                              );
                              ClearCollect(colDaOrpV, AddColumns(colDaOrphan, St, "미매칭")),
                              Notify("참석자 상태 표시를 만들지 못했습니다: " & FirstError.Message, NotificationType.Warning)
                          );
                          IfError(ClearCollect(colAttCnt, ForAll(Filter(FirstN(VisitAttendees, 2000), Coalesce(Status, "") <> "미매칭"), {No: RequestNo})); Set(gAttCntOk, true), Set(gAttCntOk, false));
                          ClearCollect(colDaAdm, FirstN(TourAdmins, 200));
                          Select(btnDaLogLoad);
                          Set(gDaFoundAt, Now());
                          Set(gDaWorking, false))
                        PaddingBottom: =0
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =0
                        PressedColor: =cWhite
                        PressedFill: =cInk
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
