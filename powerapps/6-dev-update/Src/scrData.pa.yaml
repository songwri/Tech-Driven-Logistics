# scrData — 데이터 관리 (개발자가 만든 화면, TourAdmins 의 Site = data 계정만). 개발자 10/18 버전 기준
# 바뀐 곳: 머리말(관리자 묶음의 데이터 관리 탭) · 본문 스크롤(conBodyDa) · 각진 모서리 · 색 토큰
#   접근 계정: 수식의 메일 주소 대신 TourAdmins 목록 (App.Formulas varIsDataAdmin)
#   신청(VisitRequests) 3쪽에 새 열 PartnerName · Guides 칸 추가 (고를 때 · 바뀐 내용 · 저장 · 변경 기록 JSON 모두 반영)
# ── [PA 전용] ──
#   · 화면 전체: 웹에는 없음 (웹은 시트를 직접 편집)
#   · conBodyDa: 본문만 스크롤
