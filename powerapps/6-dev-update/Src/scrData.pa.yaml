  scrData:
    Properties:
      Fill: =cBg
      OnVisible: |-
        =Select(btnDaGuard);
        If(
            varIsDataAdmin,
            Set(gDaEdit, false);
            Set(gDaDelAsk, false);
            Select(btnDaFind)
