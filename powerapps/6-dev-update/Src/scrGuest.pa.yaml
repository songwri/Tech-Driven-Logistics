# scrGuest — 방명록 (N-1, 신규 화면 · 모든 사용자 · 센터 현장 태블릿). 웹 /guestbook/ 과 같은 구성
#   · 가운데 띠: 별점 4점 이상 최근 10건이 왼쪽으로 흘러감, [멈춤] 으로 정지 · 오른쪽 평균 만족도
#   · [방명록 남기기]: 투어 카드 · 0.5점 별점 · 소감 100자 · 이름 · 회사(선택) · 팀(선택) · 직책(선택) · 가명 미리보기 · 동의 (웹 PR 97)
#   · 필요한 것: SharePoint Guestbook(관리자만) · GuestbookPublic(전 직원 읽기) 목록, 흐름 TDLGuestbookAdd · TDLGuestbookPublish
# ── [PA 전용] ──
#   · 공개 화면은 가명 값만 든 GuestbookPublic 을 읽음 (웹은 서버가 가명 값만 내려 줌)
#   · 등록은 흐름 TDLGuestbookAdd 로 원본 Guestbook 에 저장 (작성자에게 원본 목록 권한이 없어도 됨)
#   · 오른쪽 평균 만족도 카드 (웹은 로봇 · 컨베이어 그림) · conGbBody: 본문만 스크롤
# 타이머(tmrGbLane) 붙여넣기에서 오류가 나면: 삽입 → 입력 → 타이머를 직접 추가해 이름을 tmrGbLane 으로 바꾸고 Duration 80 · Repeat true · AutoStart true · Visible false, Start · OnTimerEnd 는 이 파일 값
