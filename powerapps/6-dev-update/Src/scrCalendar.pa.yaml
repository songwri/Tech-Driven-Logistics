# scrCalendar — 예약 달력. 개발자 10/18 버전 기준
# 바뀐 곳: 머리말 · 본문 스크롤(conBodyCl) · 각진 모서리 · 색 토큰
#   K-1 칩 바탕 = 상태(StatusStyle) · 왼쪽 띠 = 투어 색 (개발자 구현 유지, 색만 웹과 같게)
#   K-2 약칭 센터 · Lab · 센터+Lab (App.Formulas Tours.Short) · K-3 오늘 = 빨간 원(btnDayNo), 선택 칸 = 빨간 테두리
#   K-4 운영 안 하는 날 옅은 바탕(Op) · 대기 n 배지(개발자 구현 유지) · C-8 호스트 이름 정리
# ── [PA 전용] ──
#   · conBodyCl: 본문만 스크롤
Screens:
  scrCalendar:
    Properties:
      Fill: =cBg
      OnVisible: |-
        =If(
            IsBlank(gCalRefAt) || DateDiff(gCalRefAt, Now(), TimeUnit.Seconds) > 60,
            Refresh(VisitRequests);
            Refresh(TourBusy);
            Refresh(VisitAttendees);
            IfError(ClearCollect(colAttCnt, ForAll(Filter(FirstN(VisitAttendees, 2000), Coalesce(Status, "") <> "미매칭"), {No: RequestNo})); Set(gAttCntOk, true), Set(gAttCntOk, false));
            Set(gCalRefAt, Now())
        );
        Select(btnCalLoad)
