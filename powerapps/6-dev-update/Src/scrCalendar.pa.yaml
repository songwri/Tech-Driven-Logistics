      - btnBlkSaveC:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Color: =cWhite
            DisabledColor: =cWhite
            DisabledFill: =cInk3
            Fill: =cPrimary
            Font: =Font.'Segoe UI'
            HoverColor: =cWhite
            HoverFill: =cPrimaryHover
            OnSelect: |-
              =If(
                  gBlockDate < Today() || !(Weekday(gBlockDate, StartOfWeek.Monday) in [1, 3, 5]),
                  Set(gBlockErr, "지난 날짜이거나 운영일(월 · 수 · 금)이 아니어서 막을 수 없습니다."),
                  With(
                      {
                          k: Text(gBlockDate, "yyyy-mm-dd"),
                          f: Switch(gBlockTime, "오전", 0, "오후", 720, 0),
                          t: Switch(gBlockTime, "오전", 720, 1440),
                          c: gBlockTarget = "메가와이즈" || gBlockTarget = "센터 · Lab",
                          l: gBlockTarget = "TDL Lab" || gBlockTarget = "센터 · Lab",
                          m: gBlockTarget = "시화MTV"
                      },
                      If(
                          CountRows(Filter(Filter(TourBusy, DateKey = k, Kind = "예약"), (c && CFrom < t && f < CTo) || (l && LFrom < t && f < LTo) || (m && MFrom < t && f < MTo))) > 0,
                          Set(gBlockErr, "이미 승인된 예약과 겹치는 시간입니다. 예약을 먼저 처리해 주세요."),
                          Patch(
                              TourBusy,
                              Defaults(TourBusy),
                              {
                                  Title: "BLK-" & Text(Now(), "yymmddhhmmss"),
                                  DateKey: k,
                                  MonthKey: Left(k, 7),
                                  CFrom: If(c, f, -1), CTo: If(c, t, -1),
                                  LFrom: If(l, f, -1), LTo: If(l, t, -1),
                                  MFrom: If(m, f, -1), MTo: If(m, t, -1),
                                  Kind: "막힘",
                                  Reason: If(IsBlank(Trim(txtBlkReasonC.Text)), "-", Trim(txtBlkReasonC.Text))
                              }
                          );
                          If(
                              IsEmpty(Errors(TourBusy)),
                              Set(gShowBlockCal, false);
                              Set(gBlockErr, "");
                              ClearCollect(colBusy, Filter(TourBusy, MonthKey = Text(gMonth, "yyyy-mm")));
                              Select(btnCalLoad);
                              Notify("일정을 막았습니다.", NotificationType.Success),
                              Set(gBlockErr, "저장하지 못했습니다. TourBusy 목록 편집 권한을 확인해 주세요.")
                          )
                      )
                  )
              )
