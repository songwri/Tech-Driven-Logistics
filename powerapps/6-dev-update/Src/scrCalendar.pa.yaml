      - btnCalLoad:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =cLine
            BorderThickness: =1
            Color: =cInk
            DisabledColor: =cInk3
            DisabledFill: =cSoft
            Fill: =cSurface
            Font: =Font.'Segoe UI'
            Height: =2
            HoverColor: =cInk
            HoverFill: =cSoft
            OnSelect: |-
              =ClearCollect(
                  colCalEv,
                  ForAll(
                      Filter(
                          VisitRequests,
                          StartsWith(DateKey, Text(gCalMonth, "yyyy-mm")) && Status <> "거절" && Status <> "취소" && (gAdminSite = "hq" || (gAdminSite = "main" && ForMain = "Y") || (gAdminSite = "mtv" && ForMtv = "Y"))
                      ) As r,
                      {
                          Key: r.DateKey,
                          Time: Left(r.Slot, 5),
                          Tour: r.Tour,
                          Co: r.Company,
                          St: r.Status,
                          Flag: If(r.Language = "영어", "EN", If(r.Language = "중국어", "ZH", If(r.Interpreter = "Y", "통역", ""))),
                          Id: r.Title,
                          Who: r.TourName,
                          Host: With({n: First(Split(Coalesce(r.HostName, ""), "/")).Value}, Trim(If(Find("(", n) > 0, Left(n, Find("(", n) - 1), n))),  // C-8 괄호 영문명 · /부서 뗌
                          Div: r.HostDivision,
                          Org: r.HostOrg,
                          Head: r.ExpectedHeadcount,
                          AttN: If(gAttCntOk, CountRows(Filter(colAttCnt, No = r.Title)), Coalesce(r.AttendeeCount, 0)),
                          Space: "",
                          SpShort: ""
                      }
                  )
              );
              Collect(
                  colCalEv,
                  ForAll(
                      Filter(TourBusy, MonthKey = Text(gCalMonth, "yyyy-mm"), Kind = "막힘") As b,
                      {
                          Key: b.DateKey,
                          Time: If(Max(b.CFrom, b.LFrom, b.MFrom) = 0 && Max(b.CTo, b.LTo, b.MTo) = 1440, "종일", If(Max(b.CTo, b.LTo, b.MTo) = 720, "오전", "오후")),
                          Tour: "block",
                          Co: b.Reason,
                          St: "막힘",
                          Flag: "",
                          Id: b.Title,
                          Who: "일정 막힘 · " & Concat(Filter(Table({n: "메가와이즈", hit: Coalesce(b.CFrom, -1) >= 0}, {n: "TDL Lab", hit: Coalesce(b.LFrom, -1) >= 0}, {n: "시화MTV", hit: Coalesce(b.MFrom, -1) >= 0}), hit), n, " · "),
                          Host: "",
                          Div: "",
                          Org: "",
                          Head: 0,
                          AttN: 0,
                          Space: Concat(Filter(Table({n: "메가와이즈", hit: Coalesce(b.CFrom, -1) >= 0}, {n: "TDL Lab", hit: Coalesce(b.LFrom, -1) >= 0}, {n: "시화MTV", hit: Coalesce(b.MFrom, -1) >= 0}), hit), n, " · "),
                          SpShort: Concat(Filter(Table({n: "센터", hit: Coalesce(b.CFrom, -1) >= 0}, {n: "Lab", hit: Coalesce(b.LFrom, -1) >= 0}, {n: "시화", hit: Coalesce(b.MFrom, -1) >= 0}), hit), n, "+")
                      }
                  )
              )
            PaddingBottom: =0
            PaddingLeft: =4
            PaddingRight: =4
            PaddingTop: =0
            PressedColor: =cInk
            PressedFill: =cLine
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =14
            Text: =""
            Visible: =false
            Width: =2
