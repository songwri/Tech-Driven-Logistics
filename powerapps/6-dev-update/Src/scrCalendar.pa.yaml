                  - galCalMonth:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        Fill: =Color.Transparent
                        Height: =588
                        Items: |-
                          =ForAll(
                              Sequence(42),
                              With(
                                  {D: DateAdd(gCalMonth, Value - Weekday(gCalMonth, StartOfWeek.Sunday), TimeUnit.Days)},
                                  With(
                                      {K: Text(D, "yyyy-mm-dd")},
                                      With(
                                          {E: Sort(Filter(colCalEv, Key = K && (gCalTour = "" || Tour = gCalTour)), Time, SortOrder.Ascending)},
                                          {D: D, Key: K, Out: Month(D) <> Month(gCalMonth), Today: D = Today(), Op: Weekday(D, StartOfWeek.Monday) in [1, 3, 5] && !(K in HolidayKeys.Value), Ev: E, N: CountRows(E), Wait: CountRows(Filter(E, St = "대기"))}
                                      )
                                  )
                              )
                          )
                        OnSelect: =Set(gCalDay, ThisItem.Key); Set(gUnblockId, "")
