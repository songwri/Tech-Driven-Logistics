# scrGuides — 투어 가이드 배정 (F-05, 신규 화면 · 메가와이즈 · TDL Lab 관리자 main 만). 웹 관리자 가이드 배정 탭과 같은 화면
#   ① 달력 + 배정 패널(인솔자 복수 · 운영 인원 복수 / 전체) ② 주간 배정표(오전 · 오후 · 시간 미정 + 가동률) ③ 월간 인원별 M/M ④ 연간 월별 M/M
#   · 저장: VisitRequests.Guides (여러 줄 텍스트, 웹 시트 가이드 열과 같은 형식) · 명단: SharePoint GuideRoster 목록
# ── [PA 전용] ──
#   · 가이드 명단을 GuideRoster 목록에서 읽음 (웹은 코드에 고정) · btnGdLoad 그 해 방문을 한 번에 읽음 · btnGdSave 연속 클릭 잠금 · conGdBody: 본문만 스크롤
Screens:
  scrGuides:
    Properties:
      Fill: =cBg
      OnVisible: |-
        =If(gAdminSite <> "main", Notify("센터 관리자만 볼 수 있습니다.", NotificationType.Error); Navigate(scrAdmin),
            ClearCollect(colRoster, SortByColumns(GuideRoster, SortOrder));
            Set(gGdYear, Year(gGdMonth));
            Set(gGdSel, Blank());
            Set(gGdBusy, false);
            Set(gGdLeads, Filter(Table({Value: ""}), false));
            Set(gGdOps, Filter(Table({Value: ""}), false));
            Select(btnGdLoad))
    Children:
      - conGdBody:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =sh - 56
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll // [PA 전용] 본문 스크롤 레이아웃. 웹은 페이지 스크롤
            Width: =sw
            X: =0
            Y: =56
          Children:
            - conGdPage:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =2208
                  Width: =1366
                Children:
                  - conGdCal:
                      Control: GroupContainer@1.3.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =cLine
                        BorderThickness: =1
                        DropShadow: =DropShadow.None
                        Fill: =cSurface
                        Height: =696
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =956
                        X: =24
                        Y: =16
                      Children:
                        - lblGdCalTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =cInk
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11.25
                              Text: ="투어 가이드 배정"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =160
                              Wrap: =false
                              X: =16
                              Y: =14
                        - btnGdPrev:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =cLine
                              BorderThickness: =1
                              Color: =cInk2
                              Fill: =cSurface
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              HoverColor: =cInk
                              HoverFill: =cSoft
                              OnSelect: =Set(gGdMonth, DateAdd(gGdMonth, -1, TimeUnit.Months)); Set(gGdSel, Blank()); If(Year(gGdMonth) <> gGdYear, Set(gGdYear, Year(gGdMonth)); Select(btnGdLoad))
                              PressedColor: =cInk
                              PressedFill: =cSoft
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =10.5
                              Text: ="‹"
                              Width: =32
                              X: =184
                              Y: =10
                        - lblGdMonth:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =cInk
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11.25
                              Text: =Text(gGdMonth, "yyyy년 m월")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =110
                              Wrap: =false
                              X: =220
                              Y: =10
                        - btnGdNext:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =cLine
                              BorderThickness: =1
                              Color: =cInk2
                              Fill: =cSurface
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =32
                              HoverColor: =cInk
                              HoverFill: =cSoft
                              OnSelect: =Set(gGdMonth, DateAdd(gGdMonth, 1, TimeUnit.Months)); Set(gGdSel, Blank()); If(Year(gGdMonth) <> gGdYear, Set(gGdYear, Year(gGdMonth)); Select(btnGdLoad))
                              PressedColor: =cInk
                              PressedFill: =cSoft
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =10.5
                              Text: ="›"
                              Width: =32
                              X: =334
                              Y: =10
                        - lblGdCount:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =cInk2
                              Font: =Font.'Segoe UI'
                              Height: =24
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9
                              Text: |-
                                =With({n: CountRows(Filter(colGdVisits, Year(D) = Year(gGdMonth) && Month(D) = Month(gGdMonth)))}, n & "건 · ")
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =60
                              Wrap: =false
                              X: =380
                              Y: =14
                        - lblGdUnassigned:
                            Control: Label@2.5.1
                            Properties:
                              Color: =If(CountRows(Filter(colGdVisits, Year(D) = Year(gGdMonth) && Month(D) = Month(gGdMonth) && !(ID in Filter(colGdAssign, Role = "인솔").VisitId))) > 0, cBrand, cGreen)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9
                              Text: ="인솔자 미배정 " & CountRows(Filter(colGdVisits, Year(D) = Year(gGdMonth) && Month(D) = Month(gGdMonth) && !(ID in Filter(colGdAssign, Role = "인솔").VisitId))) & "건"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =160
                              Wrap: =false
                              X: =442
                              Y: =14
                        - lblGdHint:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =cInk3
                              Font: =Font.'Segoe UI'
                              Height: =24
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =9
                              Text: ="승인 · 완료된 Lab 포함 투어 · 칩을 눌러 배정"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =344
                              Wrap: =false
                              X: =956 - 360
                              Y: =14
                        - galGdWeekday:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderThickness: =0
                              Fill: =Color.Transparent
                              Height: =26
                              Items: =["일", "월", "화", "수", "목", "금", "토"]
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =26
                              Width: =956 - 24
                              WrapCount: =7
                              X: =12
                              Y: =52
                            Children:
                              - lblGdWeekday:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =If(ThisItem.Value in ["일", "토"], cInk3, cInk)
                                    Fill: =cBg
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =26
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =9
                                    Text: =ThisItem.Value
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =(956 - 24) / 7
                                    Wrap: =false
                                    X: =0
                                    Y: =0
                        - galGdGrid:
                            Control: Gallery@2.15.0
                            Variant: Vertical
                            Properties:
                              BorderThickness: =0
                              Fill: =Color.Transparent
                              Height: =600
                              Items: |-
                                =With(
                                    {start: DateAdd(gGdMonth, 1 - Weekday(gGdMonth), TimeUnit.Days)},
                                    ForAll(
                                        Sequence(42, 0) As n,
                                        With(
                                            {d: DateAdd(start, n.Value, TimeUnit.Days)},
                                            {D: d, Key: Text(d, "yyyy-mm-dd"), InMonth: Month(d) = Month(gGdMonth), Off: Weekday(d) in [1, 7] || Text(d, "yyyy-mm-dd") in HolidayKeys.Value, IsToday: d = Today()}
                                        )
                                    )
                                )
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =100
                              Width: =956 - 24
                              WrapCount: =7
                              X: =12
                              Y: =80
                            Children:
                              - rctGdCell:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =cLine
                                    BorderThickness: =1
                                    Fill: =If(ThisItem.InMonth && !ThisItem.Off, cSurface, cBg)
                                    Height: =100
                                    Width: =(956 - 24) / 7
                                    X: =0
                                    Y: =0
                              - btnGdDayNum:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =Color.Transparent
                                    BorderThickness: =0
                                    Color: =If(ThisItem.IsToday, cSurface, !ThisItem.InMonth, cInk3, ThisItem.Off, ColorValue("#C77A7A"), cInk)
                                    DisplayMode: =DisplayMode.View
                                    Fill: =If(ThisItem.IsToday, cBrand, Color.Transparent)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =22
                                    HoverColor: =If(ThisItem.IsToday, cSurface, !ThisItem.InMonth, cInk3, ThisItem.Off, ColorValue("#C77A7A"), cInk)
                                    HoverFill: =cSoft
                                    OnSelect: =false
                                    PressedColor: =If(ThisItem.IsToday, cSurface, !ThisItem.InMonth, cInk3, ThisItem.Off, ColorValue("#C77A7A"), cInk)
                                    PressedFill: =cSoft
                                    RadiusBottomLeft: =11
                                    RadiusBottomRight: =11
                                    RadiusTopLeft: =11
                                    RadiusTopRight: =11
                                    Size: =9
                                    Text: =Day(ThisItem.D)
                                    Width: =22
                                    X: =4
                                    Y: =4
                              - galGdChips:
                                  Control: Gallery@2.15.0
                                  Variant: Vertical
                                  Properties:
                                    BorderThickness: =0
                                    Fill: =Color.Transparent
                                    Height: =68
                                    Items: |-
                                      =With({all: SortByColumns(Filter(colGdVisits, Key = ThisItem.Key), Start)}, FirstN(all, If(CountRows(all) > 2, 1, 2)))
                                    ShowScrollbar: =false
                                    TemplatePadding: =0
                                    TemplateSize: =34
                                    Width: =(956 - 24) / 7 - 6
                                    X: =3
                                    Y: =28
                                  Children:
                                    - btnGdChip:
                                        Control: Classic/Button@2.2.0
                                        Properties:
                                          BorderColor: =If(IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")) && gGdSel.ID <> ThisItem.ID, cBrand, cLine)
                                          BorderStyle: =If(IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")), BorderStyle.Dashed, BorderStyle.Solid)
                                          BorderThickness: =1
                                          Color: =cInk
                                          Fill: =If(gGdSel.ID = ThisItem.ID, cInk, IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")), cRedBg, cSurface)
                                          Font: =Font.'Segoe UI'
                                          Height: =32
                                          HoverColor: =cInk
                                          HoverFill: =If(gGdSel.ID = ThisItem.ID, cInk, cSoft)
                                          OnSelect: |-
                                            =Set(gGdSel, LookUp(colGdVisits, ID = ThisItem.ID)); Set(gGdLeads, ForAll(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), {Value: Name})); Set(gGdOps, ForAll(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "운영"), {Value: Name}))
                                          PressedColor: =cInk
                                          PressedFill: =If(gGdSel.ID = ThisItem.ID, cInk, cSoft)
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =9.75
                                          Text: =""
                                          Width: =(956 - 24) / 7 - 6
                                          X: =0
                                          Y: =0
                                    - rctGdChipBar:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          Fill: =ThisItem.Color
                                          Height: =32
                                          OnSelect: =Select(btnGdChip)
                                          Width: =4
                                          X: =0
                                          Y: =0
                                    - lblGdChip1:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =If(gGdSel.ID = ThisItem.ID, cSurface, cInk)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =15
                                          OnSelect: =Select(btnGdChip)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =8.25
                                          Text: =ThisItem.Time & "  " & ThisItem.Company
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =(956 - 24) / 7 - 18
                                          Wrap: =false
                                          X: =8
                                          Y: =2
                                    - lblGdChip2:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =If(gGdSel.ID = ThisItem.ID, cSurface, IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")), cBrand, cInk2)
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          Height: =14
                                          OnSelect: =Select(btnGdChip)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =8.25
                                          Text: =If(IsBlank(Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ")), "인솔자 미배정", Concat(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "인솔"), Name, ", ") & If(CountRows(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "운영")) > 0, " + " & CountRows(Filter(colGdAssign, VisitId = ThisItem.ID && Role = "운영")) & "명", ""))
                                          VerticalAlign: =VerticalAlign.Middle
                                          Width: =(956 - 24) / 7 - 18
                                          Wrap: =false
                                          X: =8
                                          Y: =16
                              - lblGdMore:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =cInk2
                                    Font: =Font.'Segoe UI'
                                    Height: =18
                                    OnSelect: =Set(gGdWeek, DateAdd(ThisItem.D, 1 - Weekday(ThisItem.D, StartOfWeek.Monday), TimeUnit.Days))
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =8.25
                                    Text: ="+" & (CountRows(Filter(colGdVisits, Key = ThisItem.Key)) - 1) & "건 더 (아래 주간 표)"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Visible: =CountRows(Filter(colGdVisits, Key = ThisItem.Key)) > 2
                                    Width: =(956 - 24) / 7 - 10
                                    Wrap: =false
                                    X: =6
                                    Y: =64
