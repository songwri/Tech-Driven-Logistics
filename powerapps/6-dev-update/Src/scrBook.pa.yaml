      Fill: =cBg
      OnVisible: |-
        =If(
            gNeedReset,
            Reset(txtHostName); Reset(txtHostTitle); Reset(ddHostDivision); Reset(txtHostDivOther); Reset(txtHostOrg); Reset(txtHostPhone); Reset(txtHostEmail);
            Reset(txtCompany); Reset(txtPartner); Reset(txtHeadcount); Reset(txtPurOther); Reset(chkInterp); Reset(txtInterpLang);
            Reset(txtComment); Reset(txtAttMail); Reset(chkConsent);
            Set(gStep, 1); Set(gTour, First(OpenTours)); Set(gDate, Blank()); Set(gDateKey, ""); Set(gSlot, NoSlot);
            Set(gCategory, "external"); Set(gClientType, "신규 고객사"); Set(gIndustry, ""); Set(gPurpose, ""); Set(gLang, "ko");
            Set(gMonth, Date(Year(EarliestBase), Month(EarliestBase), 1));
            ClearCollect(colBusy, Filter(TourBusy, MonthKey = Text(gMonth, "yyyy-mm")));
            Set(gNeedReset, false)
