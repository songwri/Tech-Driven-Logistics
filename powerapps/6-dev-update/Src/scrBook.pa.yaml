#   B-1 선택일 빨강 · B-2 선택 카드 빨간 테두리 + 초록 배지 · B-3 가능일 강조 + lblMonthAvail · B-4 lblMultiWarn
#   F-01 업종 9종(기타 직접 입력 칸 lblIndOther · txtIndOther 삭제) · F-02 btnClientPartner + txtPartner(PartnerName 저장)
#   C-8 신청 담당자 이름 기본값 gMeName (괄호 영문명 · /부서 뗌)
# ── [PA 전용] ──
#   · conBodyBk: 본문만 스크롤 · 아래 버튼 줄은 화면 아래 고정
