      - btnNext:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =Color.Transparent
            BorderThickness: =0
            Color: =cWhite
            DisabledColor: =cWhite
            DisabledFill: =cInk3
            DisplayMode: =If(Switch(gStep, 1, !IsBlank(gDate) && !IsBlank(gSlot.Slot) && Left(gDateKey, 7) = Text(gMonth, "yyyy-mm") && !LookUp(SlotRows, Slot = gSlot.Slot).Busy, 2, Len(Trim(txtHostName.Text)) > 0 && Len(Trim(txtHostTitle.Text)) > 0 && ddHostDivision.Selected.Value <> "선택하세요" && (ddHostDivision.Selected.Value <> "기타" || Len(Trim(txtHostDivOther.Text)) > 0) && Len(Trim(txtHostOrg.Text)) > 0 && Len(Trim(txtHostPhone.Text)) > 0 && Len(Trim(txtHostEmail.Text)) > 0 && IsNumeric(txtHeadcount.Text) && Value(txtHeadcount.Text) >= 1 && Value(txtHeadcount.Text) <= 50 && (gCategory = "internal" || (Len(Trim(txtCompany.Text)) > 0 && !IsBlank(gClientType) && (gClientType <> "파트너사 소개 고객" || Len(Trim(txtPartner.Text)) > 0) && !IsBlank(gIndustry))) && !IsBlank(gPurpose) && (gPurpose <> "기타" || Len(Trim(txtPurOther.Text)) > 0) && (!chkInterp.Value || Len(Trim(txtInterpLang.Text)) > 0), 3, chkConsent.Value && !gSaving, false), DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =cPrimary
            Font: =Font.'Segoe UI'
            HoverColor: =cWhite
            HoverFill: =cPrimaryHover
            OnSelect: |-
              =If(
                  gStep = 1,
                  Set(gStep, 2),
                  gStep = 2,
                  Set(gIndustryTxt, gIndustry);
                  Set(gPurposeTxt, If(gPurpose = "기타", "기타: " & Trim(txtPurOther.Text), gPurpose));
                  Set(gStep, 3),
                  Set(gSaving, true);
              Set(gSaveErr, false);
              With(
                  {
                      no: "V" & Text(Today(), "yymmdd") & "-" & Text(Now(), "hhmmss"),
                      key: gDateKey,
                      langName: LookUp(Languages, Id = gLang).Name
                  },
                  If(
                      CountRows(
                          Filter(
                              Filter(TourBusy, DateKey = key),
                              (gSlot.CFrom < CTo && CFrom < gSlot.CTo) || (gSlot.LFrom < LTo && LFrom < gSlot.LTo) || (gSlot.MFrom < MTo && MFrom < gSlot.MTo)
                          )
                      ) > 0,
                      Notify("방금 다른 예약으로 이 시간이 마감되었습니다. 다른 시간을 선택해 주세요.", NotificationType.Error);
                      ClearCollect(colBusy, Filter(TourBusy, MonthKey = Text(gMonth, "yyyy-mm")));
                      Set(gSlot, NoSlot);
                      Set(gStep, 1),
                      Patch(
                          VisitRequests,
                          Defaults(VisitRequests),
                          {
                              Title: no,
                              Tour: gTour.Id,
                              TourName: gTour.Name,
                              VisitDate: gDate,
                              DateKey: key,
                              Slot: gSlot.Slot,
                              ScheduleText: gSlot.Show,
                              CFrom: gSlot.CFrom, CTo: gSlot.CTo, LFrom: gSlot.LFrom, LTo: gSlot.LTo, MFrom: gSlot.MFrom, MTo: gSlot.MTo,
                              ForMain: If(gTour.Main, "Y", "N"),
                              ForMtv: If(gTour.Mtv, "Y", "N"),
                              ApproveMain: If(gTour.Main, "대기", "-"),
                              ApproveMtv: If(gTour.Mtv, "대기", "-"),
                              Status: "대기",
                              Category: If(gCategory = "external", "고객 방문", "내부 방문"),
                              ClientType: If(gCategory = "external", gClientType, "-"),
                              PartnerName: If(gCategory = "external" && gClientType = "파트너사 소개 고객", Trim(txtPartner.Text), "-"),
                              Company: If(gCategory = "external", Trim(txtCompany.Text), If(ddHostDivision.Selected.Value = "기타", Trim(txtHostDivOther.Text), ddHostDivision.Selected.Value) & " " & Trim(txtHostOrg.Text)),
                              Industry: If(gCategory = "external", gIndustryTxt, "-"),
                              Purpose: gPurposeTxt,
                              Language: langName,
                              Interpreter: If(chkInterp.Value, "Y", "N"),
                              InterpreterLanguage: If(chkInterp.Value, Trim(txtInterpLang.Text), "-"),
                              HostName: Trim(txtHostName.Text),
                              HostTitle: Trim(txtHostTitle.Text),
                              HostDivision: If(ddHostDivision.Selected.Value = "기타", Trim(txtHostDivOther.Text), ddHostDivision.Selected.Value),
                              HostOrg: Trim(txtHostOrg.Text),
                              HostPhone: Trim(txtHostPhone.Text),
                              HostEmail: Trim(txtHostEmail.Text),
                              ApplicantEmail: Lower(User().Email),
                              HostComment: If(IsBlank(Trim(txtComment.Text)), "-", Trim(txtComment.Text)),
                              ExpectedHeadcount: Value(txtHeadcount.Text),
                              AttendeeCount: 0,
                              FormsLink: Substitute(FormsPrefillUrl, "REQNO", no),
                              InviteEmails: Trim(txtAttMail.Text),
                              AdminMemo: "-",
                              MailedStatus: "",
                              ConsentAt: Now()
                          }
                      );
                      If(
                          IsEmpty(Errors(VisitRequests)),
                          Set(gNo, no);
                          Set(gDoneLink, Substitute(FormsPrefillUrl, "REQNO", no));
                          Set(gDoneInfo, gTour.Name & " · " & Month(gDate) & "월 " & Day(gDate) & "일 (" & Mid("일월화수목금토", Max(1, Weekday(gDate, StartOfWeek.Sunday)), 1) & ")" & " " & gSlot.Show);
                          Set(gNeedReset, true);
                          Navigate(scrDone, ScreenTransition.None),
                          Set(gSaveErr, true)
                      )
                  )
              );
              Set(gSaving, false)
              )
            PaddingBottom: =0
            PaddingLeft: =4
            PaddingRight: =4
            PaddingTop: =0
            PressedColor: =cWhite
            PressedFill: =cInk
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =14
            Text: =If(gStep = 3, "신청하기", "다음")
            Width: =120
