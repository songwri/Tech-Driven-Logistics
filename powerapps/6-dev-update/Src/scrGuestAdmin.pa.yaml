# scrGuestAdmin — 방명록 관리 (N-2, 신규 화면 · 관리자만). 웹 관리자 방명록 탭과 같은 구성
#   · 위: 전체 · 공개 중 · 숨김 · 평균 평가, 투어 · 공개 상태 필터, 검색, 표(실명 · 소속 · 공개 표시 · 숨기기 / 다시 표시 · 삭제 확인)
# ── [PA 전용] ──
#   · btnGbAdmToggle: 숨기면 GuestbookPublic 행을 지우고, 다시 표시하면 가명 행을 다시 만듦 (웹은 시트 숨김 열 하나)
#   · btnGbAdmExcel: SharePoint 목록을 열어 내보내기 (웹은 화면에서 바로 엑셀 파일) · conGABody: 본문만 스크롤
