  scrGuestAdmin:
    Properties:
      Fill: =cBg
      OnVisible: |-
        =If(IsBlank(gAdminSite), Notify("관리자 권한이 없습니다.", NotificationType.Error); Navigate(scrGuest),
            Set(gGbAdmTour, "all"); Set(gGbAdmFilter, "all"); Set(gGbConfirmId, 0);
