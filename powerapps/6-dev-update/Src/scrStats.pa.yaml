# scrStats — 방문 통계. 개발자 10/18 버전 기준
# 바뀐 곳: 머리말 · 본문 스크롤(conBodySt) · 각진 모서리 · 색 토큰
#   T-1 탭(btnTab1~3 · gStatTab) 삭제 → 카드를 한 화면에 이어 붙임 (추이 · 센터 / 유형 · 목적 · 업종 / 담당 · 언어 · 직무)
#   T-2 모든 막대 값 큰 순 · 가장 큰 막대만 강조 · 건수 옆 비율(%) · 센터 / 투어 종류는 투어 색 유지
#   T-3 방문 유형 고객 · 기존 / 신규 / 파트너사 · 내부 · 미분류 (galType) · T-4 업종 9종 + 기타, 예전 값 변환, 0건 숨김 (galInd)
#   F-03 파트너사별 실적 표 (galPartner, 맨 아래)
# ── [PA 전용] ──
#   · conBodySt: 본문만 스크롤
