      - btnStatLoad:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =cLine
            BorderThickness: =1
            Color: =cInk
            DisabledColor: =cInk3
            DisabledFill: =cSoft
            Fill: =cSurface
            Font: =Font.'Segoe UI'
            Height: =2
            HoverColor: =cInk
            HoverFill: =cSoft
            OnSelect: |-
              =Set(gFrom, Switch(gStatPeriod, "year", Date(gStatYear, 1, 1), "month", Date(gStatYear, gStatMonth, 1), "range", dpFrom.SelectedDate, Date(2000, 1, 1)));
              Set(gTo, Switch(gStatPeriod, "year", Date(gStatYear, 12, 31), "month", EOMonth(Date(gStatYear, gStatMonth, 1), 0), "range", dpTo.SelectedDate, Date(2099, 12, 31)));
              With(
                  {
                      pFrom: Switch(gStatPeriod, "year", Date(gStatYear - 1, 1, 1), "month", DateAdd(Date(gStatYear, gStatMonth, 1), -1, TimeUnit.Months), "range", DateAdd(gFrom, -(DateDiff(gFrom, gTo, TimeUnit.Days) + 1), TimeUnit.Days), Date(2000, 1, 1)),
                      pTo: Switch(gStatPeriod, "year", Date(gStatYear - 1, 12, 31), "month", DateAdd(Date(gStatYear, gStatMonth, 1), -1, TimeUnit.Days), "range", DateAdd(gFrom, -1, TimeUnit.Days), Date(2000, 1, 1))
                  },
                  ClearCollect(colStat, Filter(FirstN(Filter(VisitRequests, VisitDate >= gFrom && VisitDate <= gTo), 2000), gAdminSite = "hq" || (gAdminSite = "main" && ForMain = "Y") || (gAdminSite = "mtv" && ForMtv = "Y")));
                  If(
                      gStatPeriod = "all",
                      Clear(colStatPrev),
                      ClearCollect(colStatPrev, Filter(FirstN(Filter(VisitRequests, VisitDate >= pFrom && VisitDate <= pTo), 2000), gAdminSite = "hq" || (gAdminSite = "main" && ForMain = "Y") || (gAdminSite = "mtv" && ForMtv = "Y")))
                  )
              );
              ClearCollect(colStatYear, Filter(FirstN(Filter(VisitRequests, VisitDate >= Date(StatYear, 1, 1) && VisitDate <= Date(StatYear, 12, 31)), 2000), gAdminSite = "hq" || (gAdminSite = "main" && ForMain = "Y") || (gAdminSite = "mtv" && ForMtv = "Y")));
              ClearCollect(colStatJobs, Filter(VisitAttendees, RequestNo in colStat.Title))
            PaddingBottom: =0
            PaddingLeft: =4
            PaddingRight: =4
            PaddingTop: =0
            PressedColor: =cInk
            PressedFill: =cLine
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Size: =14
            Text: =""
            Visible: =false
            Width: =2
