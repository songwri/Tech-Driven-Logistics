# scrAdmin — 관리자 (예약 관리). 개발자 10/18 버전 기준으로 수정 요청서 반영
# 바뀐 곳: 머리말 · 본문 스크롤(conBodyAd) · 각진 모서리 · 색 토큰
#   A-1 승인 초록 · A-2 승인 · 거절 · 일정 취소 · 방문 완료는 conMail(메일 미리보기 + 사유) 창에서 [보내기] (거절 · 취소 사유 필수)
#   A-3 목록 둘째 줄 한 줄(lblAdmSub) · A-4 참석자 표 머리글 선명하게, 구분 → 비고(추가 인원 표시)
#   C-8 신청자 이름 괄호 영문명 · /부서 뗌(ar3V) · F-02 방문 유형에 파트너사명(ar5V)
#   F-03 [변경] → conClient 고객 구분 빠른 변경 · F-04 [정보 수정] · [수기 등록] → conEdit
#   F-06 [방문 완료] → 상태 완료 저장, 흐름 TDLVisitDecision 사례 완료 가 방명록 요청 메일 (흐름 안내 문서)
#   최적화: 상세 영역 표시 조건을 컨테이너 conAdmDetail 하나로 (컨트롤 약 40개가 각자 계산하던 것)
#   메일은 개발자 흐름 그대로 상태 변경을 보고 흐름이 보냄. 앱은 상태 · 사유만 저장
# ── [PA 전용] ──
#   · conMail: 승인 · 거절 · 일정 취소 · 방문 완료 전 메일 미리보기 + 사유 입력 (웹에는 없음)
#   · conBodyAd: 본문만 스크롤 · btnEdSave 저장 중 잠금
Screens:
  scrAdmin:
    Properties:
      Fill: =cBg
      OnVisible: |-
        =If(
            IsBlank(gAdmRefAt) || DateDiff(gAdmRefAt, Now(), TimeUnit.Seconds) > 60,
            Refresh(VisitRequests);
            Refresh(VisitAttendees);
            IfError(ClearCollect(colAttCnt, ForAll(Filter(FirstN(VisitAttendees, 2000), Coalesce(Status, "") <> "미매칭"), {No: RequestNo})); Set(gAttCntOk, true), Set(gAttCntOk, false));
            Refresh(TourBusy);
            Set(gAdmRefAt, Now())
        );
        If(
            !IsBlank(Param("requestNo")) && !gDeepDone,
            Set(gSel, LookUp(VisitRequests, Title = Param("requestNo")));
            Set(gAdminFilter, "전체");
            Set(gDeepDone, true)
        );
        ClearCollect(colBusy, Filter(TourBusy, MonthKey = Text(gMonth, "yyyy-mm")))
    Children:
      - conBodyAd:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            BorderThickness: =0
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            Height: =sh
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll  // [PA 전용] 본문만 스크롤 · 웹은 페이지 스크롤
            Width: =sw
            X: =0
            Y: =0
          Children:
            - conPageAd:
                Control: GroupContainer@1.3.0
                Variant: ManualLayout
                Properties:
                  BorderThickness: =0
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  FillPortions: =0
                  Height: =768
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =1366
