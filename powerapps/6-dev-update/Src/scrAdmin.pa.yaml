                        BorderColor: =Color.Transparent
                        Fill: =RGBA(255, 255, 255, 0.07)
                        Height: =52
                        Visible: =!IsBlank(gAdminSite) || varIsDataAdmin  // [PA 전용] 관리자 메뉴 묶음 · 웹은 관리자 페이지가 따로 있음
