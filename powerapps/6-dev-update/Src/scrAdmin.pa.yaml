                        Font: =Font.'Segoe UI'
                        Height: =32
                        HoverColor: =cInk
                        HoverFill: =cSoft
                        OnSelect: |-
                          =Set(gRefAdm, true);
                          Refresh(VisitRequests);
                          Refresh(VisitAttendees);
                          IfError(ClearCollect(colAttCnt, ForAll(Filter(FirstN(VisitAttendees, 2000), Coalesce(Status, "") <> "미매칭"), {No: RequestNo})); Set(gAttCntOk, true), Set(gAttCntOk, false));
                          Refresh(TourBusy);
                          ClearCollect(colBusy, Filter(TourBusy, MonthKey = Text(gMonth, "yyyy-mm")));
                          Set(
                              gSel,
                              If(
                                  IsBlank(gSel),
                                  Blank(),
                                  With(
                                      {
                                          fresh: LookUp(VisitRequests, Title = gSel.Title),
                                          dirty: Trim(txtMemo.Text) <> If(gSel.AdminMemo = "-", "", Trim(gSel.AdminMemo))
                                      },
                                      If(IsBlank(fresh), Blank(), If(dirty, Patch(fresh, {AdminMemo: gSel.AdminMemo}), fresh))
                                  )
                              )
                          );
                          Set(gAdmRefAt, Now());
                          Set(gRefAdm, false)
                        PaddingBottom: =0
