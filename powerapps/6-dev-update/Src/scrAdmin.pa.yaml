                                  "거절", "요청하신 일정으로는 방문이 어렵습니다" & Char(10) & "신청번호 " & gSel.Title & Char(10) & gSel.Company & " · " & gSel.TourName & " · " & d & Char(10) & "사유 " & If(IsBlank(m), "(사유를 입력해 주세요)", m) & Char(10) & "다른 날짜로 다시 신청해 주시거나, 이 메일에 회신해 문의해 주세요.",
                                  "취소", "방문 일정이 취소되었습니다" & Char(10) & "신청번호 " & gSel.Title & Char(10) & gSel.Company & " · " & gSel.TourName & " · " & d & Char(10) & "사유 " & If(IsBlank(m), "(사유를 입력해 주세요)", m) & Char(10) & "다시 방문을 원하시면 앱에서 새로 신청해 주세요.",
                                  "완료", "참석자(Forms 로 정보를 낸 분)에게 방명록 요청 메일이 1회 갑니다." & Char(10) & "제목 방문해 주셔서 감사합니다 · 만족도와 개선 의견을 남겨 주세요" & Char(10) & "외국어 투어는 영문을 위에, 한국어를 아래에 씁니다." & Char(10) & "이미 보낸 예약 · 동의 문구 변경 전 신청 · 아직 지나지 않은 방문은 보내지 않습니다.",
                                  ""
                              )
