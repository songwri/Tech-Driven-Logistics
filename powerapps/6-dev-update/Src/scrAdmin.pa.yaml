                                =With({t: With({n: First(Split(Coalesce(ThisItem.HostName, ""), "/")).Value}, Trim(If(Find("(", n) > 0, Left(n, Find("(", n) - 1), n))) & " " & ThisItem.HostTitle & " · 참석자 " & Coalesce(If(gAttCntOk, CountRows(Filter(colAttCnt, No = ThisItem.Title)), Coalesce(ThisItem.AttendeeCount, 0)), 0) & "/" & Coalesce(ThisItem.ExpectedHeadcount, 0)}, If(Len(t) > 34, Left(t, 33) & "…", t))  // A-3 한 줄 + 말줄임, 참석자 제출/예상
