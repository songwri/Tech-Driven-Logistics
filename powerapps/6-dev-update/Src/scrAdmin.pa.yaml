                  - btnEdSave:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =1
                        Color: =cWhite
                        DisabledColor: =cWhite
                        DisabledFill: =cInk3
                        DisplayMode: =If(gEdBusy, DisplayMode.Disabled, DisplayMode.Edit)  // [PA 전용] 저장 중 연속 클릭 잠금 · 웹은 저장 중 버튼 잠금
                        Fill: =cPrimary
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        HoverColor: =cWhite
                        HoverFill: =cPrimaryHover
                        OnSelect: |-
                          =// F-04 관리자 정보 수정 · 수기 등록 (웹 RequestModal 수정 · ManualVisitModal). 관리자는 당일 · 익일 · 지난 날짜도 고를 수 있다
                          If(
                              IsBlank(dpEdit.SelectedDate), Notify("방문일을 고르세요.", NotificationType.Warning),
                              IsBlank(gEdTour), Notify("투어를 고르세요.", NotificationType.Warning),
                              gEdTour <> "other" && IsBlank(gEdSlot), Notify("시간을 고르세요.", NotificationType.Warning),
                              gEdCat = "고객 방문" && IsBlank(Trim(txtEdCompany.Text)), Notify("업체명을 입력하세요.", NotificationType.Warning),
                              gEdCat = "고객 방문" && gEdClient = "파트너사 소개 고객" && IsBlank(Trim(txtEdPartner.Text)), Notify("소개한 파트너사명을 입력하세요.", NotificationType.Warning),
                              IsBlank(gEdPurpose), Notify("방문 목적을 고르세요.", NotificationType.Warning),
                              !IsNumeric(txtEdHeads.Text) || Value(txtEdHeads.Text) < 1, Notify("방문 인원을 입력하세요.", NotificationType.Warning),
                              With(
                                  {
                                      k: Text(dpEdit.SelectedDate, "yyyy-mm-dd"),
                                      t: LookUp(Tours, Id = gEdTour),
                                      sl: LookUp(TourSlots, Tour = gEdTour && Slot = gEdSlot),
                                      st: If(gEditMode = "new", gEdStatus, gSel.Status),
                                      no: If(gEditMode = "new", "M" & Text(Now(), "yymmdd-hhmmss"), gSel.Title),
                                      tm: If(gEdTour = "other", Trim(txtEdTime.Text), gEdSlot)
                                  },
                                  With(
                                      {occ: gEdTour <> "other" && st in ["대기", "승인"]},
                                      If(
                                          occ && CountRows(Filter(Filter(TourBusy, DateKey = k) As b, b.Title <> no && ((sl.CFrom < b.CTo && b.CFrom < sl.CTo) || (sl.LFrom < b.LTo && b.LFrom < sl.LTo) || (sl.MFrom < b.MTo && b.MFrom < sl.MTo)))) > 0,
                                          Notify("같은 시간에 다른 예약이나 막힌 일정이 있습니다. 시간을 바꾸거나 달력에서 먼저 정리해 주세요.", NotificationType.Error),
                                          Set(gEdBusy, true);
                                          Patch(
                                              VisitRequests,
                                              If(gEditMode = "new", Defaults(VisitRequests), LookUp(VisitRequests, Title = gSel.Title)),
                                              {
                                                  Title: no,
                                                  Tour: gEdTour,
                                                  TourName: If(gEdTour = "other", "기타 방문", t.Name),
                                                  VisitDate: dpEdit.SelectedDate,
                                                  DateKey: k,
                                                  Slot: tm,
                                                  ScheduleText: If(gEdTour = "other", If(IsBlank(tm), "시간 미정", Substitute(tm, "-", " – ")), sl.Show),
                                                  CFrom: Coalesce(sl.CFrom, -1), CTo: Coalesce(sl.CTo, -1), LFrom: Coalesce(sl.LFrom, -1), LTo: Coalesce(sl.LTo, -1), MFrom: Coalesce(sl.MFrom, -1), MTo: Coalesce(sl.MTo, -1),
                                                  ForMain: If(gEdTour = "other" || t.Main, "Y", "N"),
                                                  ForMtv: If(gEdTour <> "other" && t.Mtv, "Y", "N"),
                                                  Category: gEdCat,
                                                  ClientType: If(gEdCat = "고객 방문", Coalesce(gEdClient, ""), "-"),
                                                  PartnerName: If(gEdCat = "고객 방문" && gEdClient = "파트너사 소개 고객", Trim(txtEdPartner.Text), "-"),
                                                  Company: If(gEdCat = "고객 방문", Trim(txtEdCompany.Text), Trim(txtEdDiv.Text & " " & txtEdOrg.Text)),
                                                  Industry: If(gEdCat = "고객 방문", Coalesce(gEdInd, "-"), "-"),
                                                  Purpose: gEdPurpose,
                                                  Language: gEdLang,
                                                  HostName: Trim(txtEdHostName.Text),
                                                  HostTitle: Trim(txtEdHostTitle.Text),
                                                  HostDivision: Trim(txtEdDiv.Text),
                                                  HostOrg: Trim(txtEdOrg.Text),
                                                  HostPhone: Trim(txtEdPhone.Text),
                                                  HostEmail: Trim(txtEdEmail.Text),
                                                  ExpectedHeadcount: Value(txtEdHeads.Text)
                                              }
                                          );
                                          If(
                                              gEditMode = "new" && IsEmpty(Errors(VisitRequests)),
                                              // 수기 등록은 메일을 보내지 않는다: MailedStatus 를 상태와 같게 두면 흐름 TDLVisitDecision 이 건너뛴다.
                                              // 흐름 TDLVisitSubmitted 는 신청번호가 M 으로 시작하면 건너뛰게 한 줄 추가 (흐름 안내 문서)
                                              Patch(
                                                  VisitRequests,
                                                  LookUp(VisitRequests, Title = no),
                                                  {
                                                      Status: st, MailedStatus: st,
                                                      ApproveMain: If(gEdTour = "other" || t.Main, If(st = "대기", "대기", "승인"), "-"),
                                                      ApproveMtv: If(gEdTour <> "other" && t.Mtv, If(st = "대기", "대기", "승인"), "-"),
                                                      ApplicantEmail: Lower(Trim(txtEdEmail.Text)), AttendeeCount: 0, Interpreter: "N", InterpreterLanguage: "-",
                                                      HostComment: "-", FormsLink: Substitute(FormsPrefillUrl, "REQNO", no), InviteEmails: "", AdminMemo: "수기 등록 · " & User().FullName
                                                  }
                                              )
                                          );
                                          If(
                                              !IsEmpty(Errors(VisitRequests)),
                                              Notify("저장하지 못했습니다. " & First(Errors(VisitRequests)).Message, NotificationType.Error),
                                              // 달력 자리(TourBusy)를 새 날짜 · 시간으로 옮김. 대기는 대기 자리, 승인은 예약 자리 (웹과 같음). 완료 · 거절 · 취소 · 기타 방문은 자리 없음
                                              Remove(TourBusy, Filter(TourBusy, Title = no, Kind <> "막힘"));
                                              If(occ, Patch(TourBusy, Defaults(TourBusy), {Title: no, DateKey: k, MonthKey: Left(k, 7), CFrom: sl.CFrom, CTo: sl.CTo, LFrom: sl.LFrom, LTo: sl.LTo, MFrom: sl.MFrom, MTo: sl.MTo, Kind: If(st = "대기", "대기", "예약"), Reason: "-"}));
                                              Set(gSel, LookUp(VisitRequests, Title = no));
                                              Set(gAdminFilter, "전체");
                                              Set(gShowEdit, false);
                                              Notify(If(gEditMode = "new", "방문 기록을 등록했습니다. 메일은 가지 않습니다.", "예약 정보를 고쳤습니다. 신청자에게 메일은 가지 않으니 필요하면 직접 알려 주세요."), NotificationType.Success)
                                          );
                                          Set(gEdBusy, false)
                                      )
                                  )
                              )
                          )
                        PaddingBottom: =0
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =0
                        PressedColor: =cWhite
                        PressedFill: =cPrimaryHover
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =14
                        Text: =If(gEdBusy, "저장 중…", If(gEditMode = "new", "등록", "저장"))
                        Width: =116
                        X: =860
                        Y: =608
