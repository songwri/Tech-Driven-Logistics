                  - btnMailSend:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =Color.Transparent
                        BorderThickness: =1
                        Color: =cWhite
                        DisabledColor: =cWhite
                        DisabledFill: =cInk3
                        DisplayMode: =If((gMailMode in ["거절", "취소"]) && IsBlank(Trim(txtMailMsg.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =If(gMailMode = "승인", cGreen, cPrimary)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        HoverColor: =cWhite
                        HoverFill: =If(gMailMode = "승인", cGreenHover, cPrimaryHover)
                        OnSelect: |-
                          =Switch(
                              gMailMode,
                              "승인",
                          With(
                              {
                                  m: If(gAdminSite = "main", "승인", gSel.ApproveMain),
                                  v: If(gAdminSite = "mtv", "승인", gSel.ApproveMtv)
                              },
                              With(
                                  {done: (gSel.ForMain = "N" || m = "승인") && (gSel.ForMtv = "N" || v = "승인")},
                                  If(
                                      done && CountRows(Filter(Filter(TourBusy, DateKey = gSel.DateKey), Title <> gSel.Title && ((gSel.CFrom < CTo && CFrom < gSel.CTo) || (gSel.LFrom < LTo && LFrom < gSel.LTo) || (gSel.MFrom < MTo && MFrom < gSel.MTo)))) > 0,
                                      Notify("이미 같은 시간에 승인된 예약이나 막힌 일정이 있어 승인할 수 없습니다.", NotificationType.Error),
                                      Patch(VisitRequests, gSel, {ApproveMain: m, ApproveMtv: v, Status: If(done, "승인", "대기"), AdminMemo: If(IsBlank(Trim(txtMailMsg.Text)), "-", Trim(txtMailMsg.Text))});
                                      If(
                                          IsEmpty(Errors(VisitRequests)),
                                          If(
                                              done,
                                              Remove(TourBusy, Filter(TourBusy, Title = gSel.Title, Kind = "대기"));
                                              Patch(
                                                  TourBusy,
                                                  Defaults(TourBusy),
                                                  {Title: gSel.Title, DateKey: gSel.DateKey, MonthKey: Left(gSel.DateKey, 7), CFrom: gSel.CFrom, CTo: gSel.CTo, LFrom: gSel.LFrom, LTo: gSel.LTo, MFrom: gSel.MFrom, MTo: gSel.MTo, Kind: "예약", Reason: "-"}
                                              )
                                          );
                                          Set(gSel, LookUp(VisitRequests, Title = gSel.Title));
                                          Notify(If(done, "승인했습니다. 확정 메일이 발송됩니다.", "내 센터 승인을 마쳤습니다. 다른 센터 승인을 기다립니다."), NotificationType.Success),
                                          Notify("저장하지 못했습니다. 권한을 확인해 주세요.", NotificationType.Error)
                                      )
                                  )
                              )
                          ),
                              "거절",
                          If(
                              IsBlank(Trim(txtMailMsg.Text)),
                              Notify("거절 사유를 입력해 주세요. 사유는 신청자 메일에 들어갑니다.", NotificationType.Warning),
                              Patch(
                                  VisitRequests,
                                  gSel,
                                  {
                                      ApproveMain: If(gAdminSite = "main", "거절", gSel.ApproveMain),
                                      ApproveMtv: If(gAdminSite = "mtv", "거절", gSel.ApproveMtv),
                                      Status: "거절",
                                      AdminMemo: Trim(txtMailMsg.Text)
                                  }
                              );
                              If(
                                  IsEmpty(Errors(VisitRequests)),
                                  Remove(TourBusy, Filter(TourBusy, Title = gSel.Title, Kind = "대기"));
                                  Set(gSel, LookUp(VisitRequests, Title = gSel.Title));
                                  Notify("거절했습니다. 거절 메일이 발송됩니다.", NotificationType.Success),
                                  Notify("저장하지 못했습니다. 권한을 확인해 주세요.", NotificationType.Error)
                              )
                          ),
                              "취소",
                          If(
                              IsBlank(Trim(txtMailMsg.Text)),
                              Notify("취소 사유를 입력해 주세요. 사유는 신청자 메일에 들어갑니다.", NotificationType.Warning),
                              // 흐름 TDLVisitDecision 이 상태 '취소' 를 보고 메일을 보내고 TourBusy 자리를 지운다 (개발자 흐름 그대로)
                              Patch(VisitRequests, gSel, {Status: "취소", CancelReason: Trim(txtMailMsg.Text)});
                              If(
                                  IsEmpty(Errors(VisitRequests)),
                                  Set(gSel, LookUp(VisitRequests, Title = gSel.Title));
                                  Notify("일정을 취소했습니다. 신청자에게 취소 메일이 발송됩니다.", NotificationType.Success),
                                  Notify("저장하지 못했습니다. 권한을 확인해 주세요.", NotificationType.Error)
                              )
                          ),
                              "완료",
                          // F-06 방문 완료: 흐름 TDLVisitDecision 의 사례 '완료' 가 참석자에게 후기(방명록) 요청 메일을 1회 보낸다
                          Patch(VisitRequests, gSel, {Status: "완료"});
                          If(
                              IsEmpty(Errors(VisitRequests)),
                              Set(gSel, LookUp(VisitRequests, Title = gSel.Title));
                              Notify("방문 완료로 바꿨습니다. 참석자에게 방명록 요청 메일이 1회 발송됩니다.", NotificationType.Success),
                              Notify("저장하지 못했습니다. 권한을 확인해 주세요.", NotificationType.Error)
                          )
                          );
                          If(IsEmpty(Errors(VisitRequests)) && !(gMailMode in ["거절", "취소"] && IsBlank(Trim(txtMailMsg.Text))), Set(gMailMode, ""))
                        PaddingBottom: =0
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =0
                        PressedColor: =cWhite
                        PressedFill: =If(gMailMode = "승인", cGreenHover, cPrimaryHover)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
