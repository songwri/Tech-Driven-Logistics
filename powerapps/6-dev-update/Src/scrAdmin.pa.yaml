                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =0
                        PressedColor: =If(gAdminFilter = "대기", cWhite, cInk)
                        PressedFill: =If(gAdminFilter = "대기", cInk, cLine)
